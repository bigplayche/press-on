<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Daily Bible devotionals and reading plans for athletes.">
<meta name="theme-color" content="#1c2b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Press On">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Press On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Barlow:wght@400;500;600;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a printed daily devotional in a phone column — varsity navy and gold on cool paper, heavy condensed caps title, Times-style indented paragraphs, brown date band, bold brown prayer. Bottom tab bar. */
:root{
  --paper:#e7eaf0; --page:#fbfbfc; --ink:#141a26; --ink-2:#343c4c; --muted:#697185; --rule:#d2d7e1;
  --band:#1c2b4b; --band-ink:#f4ecd8; --prayer:#86600f; --ok:#2f7a55; --shadow:rgba(20,30,60,.16);
  --display:"Oswald","Arial Narrow","Helvetica Neue",sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --scripture:"Tinos","Times New Roman",Times,serif;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b1019; --page:#141b29; --ink:#eef1f6; --ink-2:#cbd2de; --muted:#8b94a7; --rule:#283247;
  --band:#23375f; --band-ink:#f4ecd8; --prayer:#e2b85a; --ok:#6fcf9a; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b1019; --page:#141b29; --ink:#eef1f6; --ink-2:#cbd2de; --muted:#8b94a7; --rule:#283247;
  --band:#23375f; --band-ink:#f4ecd8; --prayer:#e2b85a; --ok:#6fcf9a; --shadow:rgba(0,0,0,.5); color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--prayer);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:26px}

.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding-block:14px;margin-bottom:6px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.brand svg{width:26px;height:26px}
.streak{display:flex;align-items:center;gap:6px;background:var(--page);border:1px solid var(--rule);border-radius:999px;padding:4px 12px 4px 9px;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.streak svg{width:17px;height:17px;color:var(--muted)}
.streak.on svg{color:var(--prayer)}
.streak small{font-family:var(--ui);font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.1em}

.eyebrow{font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--prayer)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.04;text-transform:uppercase;font-weight:700}
h1{font-size:clamp(32px,8vw,42px)}
h2{font-size:28px}
.label{display:block;font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

/* Day nav */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
.daynav .when{text-align:center;display:flex;flex-direction:column;gap:1px}
.daynav .when b{font-family:var(--serif);font-weight:400;font-size:18px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--page);display:grid;place-items:center;flex:none}
.round:disabled{opacity:.35;cursor:default}
.round svg{width:18px;height:18px}

/* The devotional page */
.page{background:var(--page);border:1px solid var(--rule);border-radius:4px;overflow:hidden;box-shadow:0 1px 0 var(--rule),0 22px 44px -26px var(--shadow)}
.band{background:var(--band);color:var(--band-ink);text-align:center;font-family:var(--ui);font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:15px;padding:9px 12px}
.page-in{padding:30px 22px 34px;display:flex;flex-direction:column;gap:22px}
@media (min-width:520px){.page-in{padding:40px 40px 44px}}
.band-day{opacity:.7}
.ptag{align-self:center;font-family:var(--ui);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 12px}
.ptitle{font-size:clamp(34px,9.4vw,50px);line-height:1;text-align:center;letter-spacing:.005em;margin-top:-6px}
.pfig{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.pverse{margin:0;font-family:var(--scripture);font-style:italic;font-size:20px;line-height:1.5;color:var(--ink-2);max-width:34em;text-wrap:pretty}
.pcite{font-family:var(--ui);font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:14px;color:var(--ink)}
.pcite small{color:var(--muted);font-size:12px;margin-left:4px}
.prose{display:flex;flex-direction:column;gap:12px}
.prose p{font-family:var(--serif);font-size:18px;line-height:1.6;text-indent:1.6em;max-width:62ch;text-wrap:pretty}
.pprayer{font-family:var(--ui);font-weight:700;color:var(--prayer);font-size:17.5px;line-height:1.45}
.lede{font-family:var(--serif);font-size:19px;line-height:1.55;text-align:center;color:var(--ink-2)}

/* Actions & buttons */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--page);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.act svg{width:17px;height:17px}
.act.saved{color:var(--prayer);border-color:var(--prayer)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--page);border:0;border-radius:4px;padding:14px 22px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}

.card{background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.play{flex-direction:row;gap:14px;align-items:flex-start}
.play svg{width:24px;height:24px;color:var(--prayer);flex:none;margin-top:2px}
.q{font-family:var(--serif);font-size:19px;line-height:1.45;font-style:italic}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;font-family:var(--serif);font-size:17px;line-height:1.5}
textarea::placeholder{color:var(--muted)}
.saved-note{font-size:13px;color:var(--muted);min-height:1em}
.complete{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--page);border:1px solid var(--rule);border-top:4px solid var(--band);border-radius:4px;padding:22px}
.complete .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--prayer);font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* Plans */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,64%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pcard{scroll-snap-align:start;padding:0;text-align:left;background:var(--page);border:1px solid var(--rule);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.pc-band{background:var(--band);color:var(--band-ink);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:6px 14px}
.pc-body{padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.pc-title{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;text-transform:uppercase}
.bar{display:block;height:5px;border-radius:5px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--prayer);border-radius:5px}
.plist{display:flex;flex-direction:column;gap:14px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--muted);font-weight:600;align-self:flex-start}
.back svg{width:18px;height:18px}
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--page);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.day>button{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) 20px;align-items:center;gap:14px;padding:14px 16px;background:none;border:0;text-align:left}
.day>button .t{display:flex;flex-direction:column}
.day>button .t b{font-family:var(--display);font-size:21px;font-weight:600;text-transform:uppercase;line-height:1.1}
.day>button .t small{color:var(--muted);font-size:14px}
.node{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted)}
.day.fin .node{background:var(--ok);border-color:var(--ok);color:var(--page)}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .2s}
.day.open .chev{transform:rotate(180deg)}
.day .inner{padding:4px 18px 20px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--rule);padding-top:18px}
.read{font-family:var(--serif);font-size:18px;line-height:1.55;text-indent:1.6em}

/* Verse cards */
.vcard{background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:10px}
.vcard p.v{font-family:var(--scripture);font-style:italic;font-size:19px;line-height:1.5}
.vcard .ref{font-family:var(--ui);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.vcard .ref small{color:var(--muted);margin-left:4px}
.vcard .act{background:var(--paper)}

/* Moments */
.moments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.moment{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:14px}
.moment b{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;line-height:1.1}
.moment small{color:var(--muted);font-size:13px;line-height:1.35}
.moment[aria-pressed="true"]{border-color:var(--band);box-shadow:inset 0 4px 0 var(--band)}
.moment[aria-pressed="true"] b{color:var(--prayer)}

/* Me */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.stat.hot b{color:var(--prayer)}
.empty{border:1px dashed var(--rule);border-radius:4px;padding:20px;color:var(--muted);text-align:center;font-family:var(--serif);font-size:17px}
.jentry{border-bottom:1px solid var(--rule);padding-block:14px;display:flex;flex-direction:column;gap:6px}
.jentry:last-child{border-bottom:0}
.jentry .d{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--prayer)}
.jentry .qq{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:16px}
.jentry .a{font-family:var(--serif);font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--page);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.readmore{align-self:center;background:none;border:0;color:var(--prayer);font-weight:600;font-size:15px;padding:4px 8px;display:inline-flex;align-items:center;gap:6px}
.readmore svg{width:16px;height:16px}
.bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bpick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--page);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;flex:none}
.bpick svg{width:16px;height:16px}
.btext{display:flex;flex-direction:column;gap:2px}
.bv{font-family:var(--scripture);font-size:19px;line-height:1.65;padding:4px 8px;margin:0 -8px;border-radius:4px;scroll-margin-top:90px}
.bv sup{font-family:var(--ui);font-size:11px;font-weight:600;color:var(--muted);margin-right:5px;vertical-align:super;line-height:0}
.bv.hl{background:rgba(226,184,90,.22);box-shadow:inset 3px 0 0 var(--prayer)}
.bnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bnav .btn{font-size:15px;padding:12px 10px}
.blist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bbook{text-align:left;background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:11px 12px;display:flex;flex-direction:column;gap:1px}
.bbook b{font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;line-height:1.15}
.bbook small{color:var(--muted);font-size:12px}
.bbook[aria-current="true"]{border-color:var(--prayer);box-shadow:inset 0 3px 0 var(--prayer)}
.bchaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.bchaps button{aspect-ratio:1;background:var(--page);border:1px solid var(--rule);border-radius:4px;font-family:var(--display);font-size:18px;font-weight:600}
.bchaps button[aria-current="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}

.tab{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--prayer)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,14,8,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:600px;max-height:100%;overflow:auto;background:var(--page);border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet img{width:100%;max-width:100%;border-radius:4px;display:block;aspect-ratio:4/5;background:var(--paper);border:1px solid var(--rule)}
.swatches{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.sw{aspect-ratio:1;border-radius:6px;border:2px solid var(--rule);background:var(--paper) center/cover;padding:0}
.sw[aria-pressed="true"]{border-color:var(--prayer)}
.hint{font-size:13px;color:var(--muted);text-align:center}
.row{display:flex;gap:10px}
.row .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--page);font-weight:600;padding:10px 18px;border-radius:999px;z-index:50;transition:.25s;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.complete .big{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.install{background:var(--band);color:var(--band-ink);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.install h3{font-family:var(--display);font-size:22px;text-transform:uppercase;margin:0}
.install p{font-size:15px;line-height:1.45;opacity:.92}
.install ol{margin:0;padding-left:20px;font-size:15px;line-height:1.5}
.install .row{gap:8px;flex-wrap:wrap}
.install .btn{background:var(--band-ink);color:var(--band);font-size:16px;padding:11px 18px;flex:0 0 auto}
.install .btn.ghost{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.35)}
.install svg.share{width:18px;height:18px;vertical-align:-3px}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="4" style="fill:var(--band)"/><path d="M16 7v18M10 13h12" style="stroke:var(--band-ink)" stroke-width="3" stroke-linecap="round"/></svg>
      Press On
    </div>
    <div class="streak" id="streak" title="Day streak"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Main">
  <div class="tabs-in">
    <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button class="tab" data-tab="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2 2 4-4"/></svg>Plans</button>
    <button class="tab" data-tab="moments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M12 7v6M9 10h6"/></svg>Locker</button>
    <button class="tab" data-tab="bible"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c3-1.5 6.5-1.5 10 1v14c-3.5-2.5-7-2.5-10-1z"/><path d="M22 5c-3-1.5-6.5-1.5-10 1v14c3.5-2.5 7-2.5 10-1z"/></svg>Bible</button>
    <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">Verse Image</h2><button class="round" id="closeSheet" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <img id="imgOut" alt="Verse image">

"Joshua 1:7": "Only be strong and very courageous. Be careful to observe to do according to all the law which Moses my servant commanded you. Don’t turn from it to the right hand or to the left, that you may have good success wherever you go.",
"Joshua 1:9": "“Haven’t I commanded you? Be strong and courageous. Don’t be afraid. Don’t be dismayed, for Yahweh your God is with you wherever you go.”",
"Joshua 24:15": "“If it seems evil to you to serve Yahweh, choose today whom you will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amorites, in whose land you dwell; but as for me and my house, we will serve Yahweh.”",
"Joshua 3:5": "Joshua said to the people, “Sanctify yourselves; for tomorrow Yahweh will do wonders among you.”",
"Jude 1:24": "Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy.",
"Judges 6:12": "Yahweh’s angel appeared to him, and said to him, “Yahweh is with you, you mighty man of valor!”",
"Judges 7:2": "Yahweh said to Gideon, “The people who are with you are too many for me to give the Midianites into their hand, lest Israel brag against me, saying, ‘My own hand has saved me.’”",
"Lamentations 3:22-23": "It is because of Yahweh’s loving kindnesses that we are not consumed, because his compassion doesn’t fail. They are new every morning. Great is your faithfulness.",
"Lamentations 3:25": "Yahweh is good to those who wait for him, to the soul who seeks him.",
"Lamentations 3:40": "Let us search and try our ways, and turn again to Yahweh.",
"Leviticus 19:32": "“ ‘You shall rise up before the gray head and honor the face of the elderly; and you shall fear your God. I am Yahweh.”",
"Luke 10:41-42": "Jesus answered her, “Martha, Martha, you are anxious and troubled about many things, but one thing is needed. Mary has chosen the good part, which will not be taken away from her.”",
"Luke 12:25": "Which of you by being anxious can add a cubit to his height?",
"Luke 15:20": "“He arose, and came to his father. But while he was still far off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him.”",
"Luke 16:10": "He who is faithful in a very little is faithful also in much. He who is dishonest in a very little is also dishonest in much.",
"Luke 18:1": "He also spoke a parable to them that they must always pray, and not give up.",
"Luke 1:37": "“For nothing spoken by God is impossible.”",
"Luke 22:42": "Saying, “Father, if you are willing, remove this cup from me. Nevertheless, not my will, but yours, be done.”",
"Luke 2:52": "And Jesus increased in wisdom and stature, and in favor with God and men.",
"Luke 5:5": "Simon answered him, “Master, we worked all night, and took nothing; but at your word I will let down the net.”",
"Luke 6:38": "“Give, and it will be given to you: good measure, pressed down, shaken together, and running over, will be given to you. For with the same measure you measure it will be measured back to you.”",
"Luke 9:23": "He said to all, “If anyone desires to come after me, let him deny himself, take up his cross, and follow me.”",
"Luke 9:62": "But Jesus said to him, “No one, having put his hand to the plow, and looking back, is fit for God’s Kingdom.”",
"Malachi 4:2": "But to you who fear my name shall the sun of righteousness arise with healing in its wings. You will go out, and leap like calves of the stall.",
"Mark 10:27": "Jesus, looking at them, said, “With men it is impossible, but not with God, for all things are possible with God.”",
"Mark 10:45": "“For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many.”",
"Mark 11:24": "Therefore I tell you, all things whatever you pray and ask for, believe that you have received them, and you shall have them.",
"Mark 1:35": "Early in the morning, while it was still dark, he rose up and went out, and departed into a deserted place, and prayed there.",
"Mark 4:39": "He awoke, and rebuked the wind, and said to the sea, “Peace! Be still!” The wind ceased, and there was a great calm.",
"Mark 5:36": "But Jesus, when he heard the message spoken, immediately said to the ruler of the synagogue, “Don’t be afraid, only believe.”",
"Mark 6:31": "He said to them, “You come apart into a deserted place, and rest awhile.” For there were many coming and going, and they had no leisure so much as to eat.",
"Mark 9:24": "Immediately the father of the child cried out with tears, “I believe. Help my unbelief!”",
"Matthew 10:30-31": "But the very hairs of your head are all numbered. Therefore don’t be afraid. You are of more value than many sparrows.",
"Matthew 11:28": "“Come to me, all you who labor and are heavily burdened, and I will give you rest.”",
"Matthew 11:29": "Take my yoke upon you, and learn from me, for I am gentle and humble in heart; and you will find rest for your souls.",
"Matthew 14:29-30": "He said, “Come!” Peter stepped down from the boat, and walked on the waters to come to Jesus. But when he saw that the wind was strong, he was afraid, and beginning to sink, he cried out, saying, “Lord, save me!”",
"Matthew 17:20": "He said to them, “Because of your unbelief. For most certainly I tell you, if you have faith as a grain of mustard seed, you will tell this mountain, ‘Move from here to there,’ and it will move; and nothing will be impossible for you.”",
"Matthew 19:26": "Looking at them, Jesus said, “With men this is impossible, but with God all things are possible.”",
"Matthew 20:26": "It shall not be so among you, but whoever desires to become great among you shall be your servant.",
"Matthew 22:37": "Jesus said to him, “ ‘You shall love the Lord your God with all your heart, with all your soul, and with all your mind.’”",
"Matthew 25:21": "“His lord said to him, ‘Well done, good and faithful servant. You have been faithful over a few things, I will set you over many things. Enter into the joy of your lord.’”",
"Matthew 26:41": "“Watch and pray, that you don’t enter into temptation. The spirit indeed is willing, but the flesh is weak.”",
"Matthew 28:20": "“Teaching them to observe all things that I commanded you. Behold, I am with you always, even to the end of the age.” Amen.",
"Matthew 4:19": "He said to them, “Come after me, and I will make you fishers for men.”",
"Matthew 5:14": "You are the light of the world. A city located on a hill can’t be hidden.",
"Matthew 5:16": "Even so, let your light shine before men; that they may see your good works, and glorify your Father who is in heaven.",
"Matthew 5:3": "“Blessed are the poor in spirit, for theirs is the Kingdom of Heaven.”",
"Matthew 5:44": "But I tell you, love your enemies, bless those who curse you, do good to those who hate you, and pray for those who mistreat you and persecute you.",
"Matthew 5:9": "Blessed are the peacemakers, for they shall be called children of God.",
"Matthew 6:33": "But seek first God’s Kingdom, and his righteousness; and all these things will be given to you as well.",
"Matthew 6:34": "Therefore don’t be anxious for tomorrow, for tomorrow will be anxious for itself. Each day’s own evil is sufficient.",
"Matthew 6:6": "But you, when you pray, enter into your inner room, and having shut your door, pray to your Father who is in secret, and your Father who sees in secret will reward you openly.",
"Matthew 7:12": "Therefore whatever you desire for men to do to you, you shall also do to them; for this is the law and the prophets.",
"Matthew 7:24-25": "“Everyone therefore who hears these words of mine, and does them, I will liken him to a wise man, who built his house on a rock. The rain came down, the floods came, and the winds blew, and beat on that house; and it didn’t fall, for it was founded on the rock.”",
"Matthew 7:7": "“Ask, and it will be given you. Seek, and you will find. Knock, and it will be opened for you.”",
"Micah 6:8": "He has shown you, O man, what is good. What does Yahweh require of you, but to act justly, to love mercy, and to walk humbly with your God?",
"Micah 7:8": "Don’t rejoice against me, my enemy. When I fall, I will arise. When I sit in darkness, Yahweh will be a light to me.",
"Nahum 1:7": "Yahweh is good, a stronghold in the day of trouble; and he knows those who take refuge in him.",
"Nehemiah 4:14": "I looked, and rose up, and said to the nobles, to the rulers, and to the rest of the people, “Don’t be afraid of them! Remember the Lord, who is great and awesome, and fight for your brothers, your sons, your daughters, your wives, and your houses.”",
"Nehemiah 8:10": "Then he said to them, “Go your way. Eat the fat, drink the sweet, and send portions to him for whom nothing is prepared, for today is holy to our Lord. Don’t be grieved, for the joy of Yahweh is your strength.”",
"Numbers 13:30": "Caleb stilled the people before Moses, and said, “Let’s go up at once, and possess it; for we are well able to overcome it!”",
"Numbers 23:19": "God is not a man, that he should lie, nor a son of man, that he should repent. Has he said, and will he not do it? Or has he spoken, and will he not make it good?",
"Numbers 6:24-26": "‘Yahweh bless you, and keep you. Yahweh make his face to shine on you, and be gracious to you. Yahweh lift up his face toward you, and give you peace.’",
"Philippians 1:6": "Being confident of this very thing, that he who began a good work in you will complete it until the day of Jesus Christ.",
"Philippians 2:14": "Do all things without complaining and arguing.",
"Philippians 2:3": "Doing nothing through rivalry or through conceit, but in humility, each counting others better than himself.",
"Philippians 3:13-14": "Brothers, I don’t regard myself as yet having taken hold, but one thing I do: forgetting the things which are behind, and stretching forward to the things which are before, I press on toward the goal for the prize of the high calling of God in Christ Jesus.",
"Philippians 4:11-12": "Not that I speak because of lack, for I have learned in whatever state I am, to be content in it. I know how to be humbled, and I also know how to abound. In everything and in all things I have learned the secret both to be filled and to be hungry, both to abound and to be in need.",
"Philippians 4:13": "I can do all things through Christ, who strengthens me.",
"Philippians 4:19": "My God will supply every need of yours according to his riches in glory in Christ Jesus.",
"Philippians 4:6-7": "In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus.",
"Philippians 4:8": "Finally, brothers, whatever things are true, whatever things are honorable, whatever things are just, whatever things are pure, whatever things are lovely, whatever things are of good report: if there is any virtue and if there is any praise, think about these things.",
"Proverbs 10:4": "He becomes poor who works with a lazy hand, but the hand of the diligent brings wealth.",
"Proverbs 10:9": "He who walks blamelessly walks surely, but he who perverts his ways will be found out.",
"Proverbs 11:2": "When pride comes, then comes shame, but with humility comes wisdom.",
"Proverbs 12:1": "Whoever loves correction loves knowledge, but he who hates reproof is stupid.",
"Proverbs 12:25": "Anxiety in a man’s heart weighs it down, but a kind word makes it glad.",
"Proverbs 13:20": "One who walks with wise men grows wise, but a companion of fools suffers harm.",
"Proverbs 14:23": "In all hard work there is profit, but the talk of the lips leads only to poverty.",
"Proverbs 15:1": "A gentle answer turns away wrath, but a harsh word stirs up anger.",
"Proverbs 15:22": "Where there is no counsel, plans fail; but in a multitude of counselors they are established.",
"Proverbs 16:18": "Pride goes before destruction, and an arrogant spirit before a fall.",
"Proverbs 16:3": "Commit your deeds to Yahweh, and your plans shall succeed.",
"Proverbs 16:32": "One who is slow to anger is better than the mighty; one who rules his spirit, than he who takes a city.",
"Proverbs 16:9": "A man’s heart plans his course, but Yahweh directs his steps.",
"Proverbs 17:17": "A friend loves at all times; and a brother is born for adversity.",
"Proverbs 17:22": "A cheerful heart makes good medicine, but a crushed spirit dries up the bones.",
"Proverbs 18:10": "Yahweh’s name is a strong tower: the righteous run to him, and are safe.",
"Proverbs 18:24": "A man of many companions may be ruined, but there is a friend who sticks closer than a brother.",
"Proverbs 19:20": "Listen to counsel and receive instruction, that you may be wise in your latter end.",
"Proverbs 19:21": "There are many plans in a man’s heart, but Yahweh’s counsel will prevail.",
"Proverbs 20:11": "Even a child makes himself known by his doings, whether his work is pure, and whether it is right.",
"Proverbs 21:31": "The horse is prepared for the day of battle; but victory is with Yahweh.",
"Proverbs 22:1": "A good name is more desirable than great riches, and loving favor is better than silver and gold.",
"Proverbs 22:29": "Do you see a man skilled in his work? He will serve kings. He won’t serve obscure men.",
"Proverbs 24:16": "For a righteous man falls seven times and rises up again; but the wicked are overthrown by calamity.",
"Proverbs 25:28": "Like a city that is broken down and without walls is a man whose spirit is without restraint.",
"Proverbs 27:17": "Iron sharpens iron; so a man sharpens his friend’s countenance.",
"Proverbs 27:2": "Let another man praise you, and not your own mouth; a stranger, and not your own lips.",
"Proverbs 28:1": "The wicked flee when no one pursues; but the righteous are as bold as a lion.",
"Proverbs 29:25": "The fear of man proves to be a snare, but whoever puts his trust in Yahweh is kept safe.",
"Proverbs 31:25": "Strength and dignity are her clothing. She laughs at the time to come.",
"Proverbs 3:11-12": "My son, don’t despise Yahweh’s discipline, neither be weary of his correction; for whom Yahweh loves, he corrects, even as a father reproves the son in whom he delights.",
"Proverbs 3:5-6": "Trust in Yahweh with all your heart, and don’t lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight.",
"Proverbs 4:23": "Keep your heart with all diligence, for out of it is the wellspring of life.",
"Proverbs 4:25-26": "Let your eyes look straight ahead. Fix your gaze directly before you. Make the path of your feet level. Let all of your ways be established.",
"Proverbs 6:6": "Go to the ant, you sluggard. Consider her ways, and be wise.",
"Psalm 100:2": "Serve Yahweh with gladness. Come before his presence with singing.",
"Psalm 103:12": "As far as the east is from the west, so far has he removed our transgressions from us.",
"Psalm 103:2": "Praise Yahweh, my soul, and don’t forget all his benefits.",
"Psalm 107:1": "Give thanks to Yahweh, for he is good, for his loving kindness endures forever.",
"Psalm 112:7": "He will not be afraid of evil news. His heart is steadfast, trusting in Yahweh.",
"Psalm 116:1": "I love Yahweh, because he listens to my voice, and my cries for mercy.",
"Psalm 118:24": "This is the day that Yahweh has made. We will rejoice and be glad in it!",
"Psalm 118:6": "Yahweh is on my side. I will not be afraid. What can man do to me?",
"Psalm 119:105": "Your word is a lamp to my feet, and a light for my path.",
"Psalm 119:11": "I have hidden your word in my heart, that I might not sin against you.",
"Psalm 119:9": "How can a young man keep his way pure? By living according to your word.",
"Psalm 121:1-2": "I will lift up my eyes to the hills. Where does my help come from? My help comes from Yahweh, who made heaven and earth.",
"Psalm 121:3": "He will not allow your foot to be moved. He who keeps you will not slumber.",
"Psalm 127:2": "It is vain for you to rise up early, to stay up late, eating the bread of toil, for he gives sleep to his loved ones.",
"Psalm 133:1": "See how good and how pleasant it is for brothers to live together in unity!",
"Psalm 138:3": "In the day that I called, you answered me. You encouraged me with strength in my soul.",
"Psalm 139:14": "I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well.",
"Psalm 139:23-24": "Search me, God, and know my heart. Try me, and know my thoughts. See if there is any wicked way in me, and lead me in the everlasting way.",
"Psalm 143:10": "Teach me to do your will, for you are my God. Your Spirit is good. Lead me in the land of uprightness.",
"Psalm 143:8": "Cause me to hear your loving kindness in the morning, for I trust in you. Cause me to know the way in which I should walk, for I lift up my soul to you.",
"Psalm 145:18": "Yahweh is near to all those who call on him, to all who call on him in truth.",
"Psalm 147:10-11": "He doesn’t delight in the strength of the horse. He takes no pleasure in the legs of a man. Yahweh takes pleasure in those who fear him, in those who hope in his loving kindness.",
"Psalm 150:6": "Let everything that has breath praise Yah! Praise Yah!",
"Psalm 16:11": "You will show me the path of life. In your presence is fullness of joy. In your right hand there are pleasures forever more.",
"Psalm 16:8": "I have set Yahweh always before me. Because he is at my right hand, I shall not be moved.",
"Psalm 18:2": "Yahweh is my rock, my fortress, and my deliverer; my God, my rock, in whom I take refuge; my shield, and the horn of my salvation, my high tower.",
"Psalm 18:29": "For by you, I advance through a troop. By my God, I leap over a wall.",
"Psalm 19:14": "Let the words of my mouth and the meditation of my heart be acceptable in your sight, Yahweh, my rock, and my redeemer.",
"Psalm 1:3": "He will be like a tree planted by the streams of water, that produces its fruit in its season, whose leaf also does not wither. Whatever he does shall prosper.",
"Psalm 20:7": "Some trust in chariots, and some in horses, but we trust in the name of Yahweh our God.",
"Psalm 23:1": "Yahweh is my shepherd: I shall lack nothing.",
"Psalm 23:4": "Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me. Your rod and your staff, they comfort me.",
"Psalm 25:5": "Guide me in your truth, and teach me, For you are the God of my salvation, I wait for you all day long.",
"Psalm 27:1": "Yahweh is my light and my salvation. Whom shall I fear? Yahweh is the strength of my life. Of whom shall I be afraid?",
"Psalm 27:14": "Wait for Yahweh. Be strong, and let your heart take courage. Yes, wait for Yahweh.",
"Psalm 28:7": "Yahweh is my strength and my shield. My heart has trusted in him, and I am helped. Therefore my heart greatly rejoices. With my song I will thank him.",
"Psalm 30:5": "For his anger is but for a moment. His favor is for a lifetime. Weeping may stay for the night, but joy comes in the morning.",
"Psalm 31:24": "Be strong, and let your heart take courage, all you who hope in Yahweh.",
"Psalm 32:8": "I will instruct you and teach you in the way which you shall go. I will counsel you with my eye on you.",
"Psalm 34:18": "Yahweh is near to those who have a broken heart, and saves those who have a crushed spirit.",
"Psalm 34:4": "I sought Yahweh, and he answered me, and delivered me from all my fears.",
"Psalm 34:8": "Oh taste and see that Yahweh is good. Blessed is the man who takes refuge in him.",
"Psalm 37:23-24": "A man’s steps are established by Yahweh. He delights in his way. Though he stumble, he shall not fall, for Yahweh holds him up with his hand.",
"Psalm 37:4": "Also delight yourself in Yahweh, and he will give you the desires of your heart.",
"Psalm 37:5": "Commit your way to Yahweh. Trust also in him, and he will do this.",
"Psalm 37:7": "Rest in Yahweh, and wait patiently for him. Don’t fret because of him who prospers in his way, because of the man who makes wicked plots happen.",
"Psalm 3:3": "But you, Yahweh, are a shield around me, my glory, and the one who lifts up my head.",
"Psalm 40:2": "He brought me up also out of a horrible pit, out of the miry clay. He set my feet on a rock, and gave me a firm place to stand.",
"Psalm 42:11": "Why are you in despair, my soul? Why are you disturbed within me? Hope in God! For I shall still praise him, the saving help of my countenance, and my God.",
"Psalm 46:1": "God is our refuge and strength, a very present help in trouble.",
"Psalm 46:10": "“Be still, and know that I am God. I will be exalted among the nations. I will be exalted in the earth.”",
"Psalm 4:8": "In peace I will both lay myself down and sleep, for you, Yahweh alone, make me live in safety.",
"Psalm 51:10": "Create in me a clean heart, O God. Renew a right spirit within me.",
"Psalm 55:22": "Cast your burden on Yahweh and he will sustain you. He will never allow the righteous to be moved.",
"Psalm 56:3": "When I am afraid, I will put my trust in you.",
"Psalm 57:7": "My heart is steadfast, God. My heart is steadfast. I will sing, yes, I will sing praises.",
"Psalm 59:16": "But I will sing of your strength. Yes, I will sing aloud of your loving kindness in the morning. For you have been my high tower, a refuge in the day of my distress.",
"Psalm 5:3": "Yahweh, in the morning you will hear my voice. In the morning I will lay my requests before you, and will watch expectantly.",
"Psalm 61:2": "From the end of the earth, I will call to you when my heart is overwhelmed. Lead me to the rock that is higher than I.",
"Psalm 62:1-2": "My soul rests in God alone. My salvation is from him. He alone is my rock, my salvation, and my fortress. I will never be greatly shaken.",
"Psalm 62:8": "Trust in him at all times, you people. Pour out your heart before him. God is a refuge for us.",
"Psalm 63:1": "God, you are my God. I will earnestly seek you. My soul thirsts for you. My flesh longs for you, in a dry and weary land, where there is no water.",
"Psalm 68:19": "Blessed be the Lord, who daily bears our burdens, even the God who is our salvation.",
"Psalm 71:5": "For you are my hope, Lord Yahweh, my confidence from my youth.",
"Psalm 73:26": "My flesh and my heart fails, but God is the strength of my heart and my portion forever.",
"Psalm 84:11": "For Yahweh God is a sun and a shield. Yahweh will give grace and glory. He withholds no good thing from those who walk blamelessly.",
"Psalm 84:5": "Blessed are those whose strength is in you, who have set their hearts on a pilgrimage.",
"Psalm 86:11": "Teach me your way, Yahweh. I will walk in your truth. Make my heart undivided to fear your name.",
"Psalm 90:12": "So teach us to count our days, that we may gain a heart of wisdom.",
"Psalm 90:17": "Let the favor of the Lord our God be on us. Establish the work of our hands for us. Yes, establish the work of our hands.",
"Psalm 91:1-2": "He who dwells in the secret place of the Most High will rest in the shadow of the Almighty. I will say of Yahweh, “He is my refuge and my fortress; my God, in whom I trust.”",
"Psalm 91:11": "For he will put his angels in charge of you, to guard you in all your ways.",
"Psalm 94:18": "When I said, “My foot is slipping!” Your loving kindness, Yahweh, held me up.",
"Psalm 94:19": "In the multitude of my thoughts within me, your comforts delight my soul.",
"Psalm 9:1": "I will give thanks to Yahweh with my whole heart. I will tell of all your marvelous works.",
"Revelation 21:4": "“He will wipe away every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain, any more. The first things have passed away.”",
"Revelation 21:5": "He who sits on the throne said, “Behold, I am making all things new.” He said, “Write, for these words of God are faithful and true.”",
"Revelation 3:20": "Behold, I stand at the door and knock. If anyone hears my voice and opens the door, then I will come in to him, and will dine with him, and he with me.",
"Romans 12:1": "Therefore I urge you, brothers, by the mercies of God, to present your bodies a living sacrifice, holy, acceptable to God, which is your spiritual service.",
"Romans 12:10": "In love of the brothers be tenderly affectionate to one another; in honor preferring one another.",
"Romans 12:12": "Rejoicing in hope; enduring in troubles; continuing steadfastly in prayer.",
"Romans 12:15": "Rejoice with those who rejoice. Weep with those who weep.",
"Romans 12:18": "If it is possible, as much as it is up to you, be at peace with all men.",
"Romans 12:2": "Don’t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God.",
"Romans 12:21": "Don’t be overcome by evil, but overcome evil with good.",
"Romans 15:13": "Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope, in the power of the Holy Spirit.",
"Romans 5:3-4": "Not only this, but we also rejoice in our sufferings, knowing that suffering produces perseverance; and perseverance, proven character; and proven character, hope.",
"Romans 8:1": "There is therefore now no condemnation to those who are in Christ Jesus, who don’t walk according to the flesh, but according to the Spirit.",
"Romans 8:18": "For I consider that the sufferings of this present time are not worthy to be compared with the glory which will be revealed toward us.",
"Romans 8:28": "We know that all things work together for good for those who love God, for those who are called according to his purpose.",
"Romans 8:31": "What then shall we say about these things? If God is for us, who can be against us?",
"Romans 8:37": "No, in all these things, we are more than conquerors through him who loved us.",
"Romans 8:38-39": "For I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other created thing will be able to separate us from God’s love which is in Christ Jesus our Lord.",
"Ruth 1:16": "Ruth said, “Don’t urge me to leave you, and to return from following you, for where you go, I will go; and where you stay, I will stay. Your people will be my people, and your God my God.”",
"Ruth 2:12": "“May Yahweh repay your work, and a full reward be given to you from Yahweh, the God of Israel, under whose wings you have come to take refuge.”",
"Titus 2:7": "In all things be showing yourself an example of good works. In your teaching, be showing integrity, seriousness, incorruptibility.",
"Zechariah 4:10": "“Indeed, who despises the day of small things? For these seven shall rejoice, and shall see the plumb line in the hand of Zerubbabel. These are Yahweh’s eyes, which run back and forth through the whole earth.”",
"Zechariah 4:6": "Then he answered and spoke to me, saying, “This is Yahweh’s word to Zerubbabel, saying, ‘Not by might, nor by power, but by my Spirit,’ says Yahweh of Armies.”",
"Zephaniah 3:17": "Yahweh, your God, is among you, a mighty one who will save. He will rejoice over you with joy. He will calm you in his love. He will rejoice over you with singing.",

const DAILY = [
{tag:"Injury",title:"The Comeback Starts in the Waiting Room",ref:"Isaiah 40:31",scene:"track",
story:["The MRI said ACL. Just like that, the season you trained all summer for turned into a calendar of rehab appointments. Your teammates are at practice and you are on a table doing quad sets that barely look like exercise.","Isaiah wrote to people stuck in a season they did not choose. His promise is not that the waiting gets skipped. It is that the waiting is where strength gets renewed. Notice the order: soar, run, walk. Sometimes God’s best gift is the strength to walk the next rep without quitting.","Rehab is not wasted time. It is where patience, humility and trust get built, and those travel with you long after the knee heals."],
q:"What part of your recovery or setback feels most like waiting right now? What would it look like to trust God in that exact spot?",
prayer:"God, I don’t like waiting. I want my body back and my spot back. Renew my strength for today’s work, even if today’s work is small. Teach me to trust you on the training table as much as on the field. Amen.",
play:"Do every rehab or recovery rep today with full effort, and thank God for one thing your body can still do."},
{tag:"Pressure",title:"Two Free Throws, Down One",ref:"Joshua 1:9",scene:"lights",
story:["Two seconds left. Down one. The ref hands you the ball and the gym gets so loud it goes quiet. Your heart is pounding in your ears and your mind starts listing every way this could go wrong.","Joshua was handed the biggest moment of his life: lead a nation after Moses. God told him to be strong and courageous three times in one chapter, which tells you Joshua needed to hear it more than once. The reason for courage was not Joshua’s skill. It was who stood beside him.","“Wherever you go” includes the free throw line. Make it or miss it, you are not alone up there, and the outcome does not decide who you are."],
q:"What big moment makes your heart race? What changes if you picture God standing next to you in it?",
prayer:"God, when the moment gets big, remind me that you are bigger. Calm my breathing and steady my hands. Win or lose, I belong to you. Amen.",
play:"Pick a short phrase from Joshua 1:9 to repeat in your pre-shot or pre-snap routine today."},
{tag:"Losing",title:"When the Scoreboard Says You Lost",ref:"Micah 7:8",scene:"court",
story:["The bus ride after a loss is the quietest place in sports. Nobody wants to talk. You keep replaying the turnover, the missed tackle, the call that went the other way.","Micah writes like someone who has been knocked down and heard the other side celebrate. But he does not stay on the ground: “When I fall, I will arise.” He admits the fall and the darkness. He also knows they are not the end of the story.","A loss is real and it should sting a little. It just doesn’t get the final word on your season or your worth."],
q:"What loss are you still carrying? What is one thing you can learn from it, and one thing you need to let go of?",
prayer:"Lord, this one hurts. Help me feel it honestly without letting it define me. Be my light while I sit in the dark, and help me get back up for the next practice. Amen.",
play:"Watch one clip from your last loss to learn from it. Then close it and move on."},
{tag:"Weakness",title:"Strong Where You’re Weak",ref:"2 Corinthians 12:9",scene:"summit",
story:["Every athlete has a weakness the scouting report knows about. Weak hand. Slow first step. A backhand that breaks down under pressure. Most of us spend our careers hiding it.","Paul had a weakness too, something he called a thorn. He begged God three times to take it away. God’s answer was not “I’ll fix it.” It was “My grace is enough, and my power shows up best right there.”","Keep training your weak hand. But your worth, your peace and your hope do not depend on having no weaknesses. The place you feel most exposed can become the place people see God most clearly in you."],
q:"What weakness are you most afraid people will see? How might God use it instead of you hiding it?",
prayer:"Lord, you know every limit I have. I bring you the things I can’t fix on my own. Let your strength show up where I am weakest, and keep me honest about what I need. Amen.",
play:"Spend 10 extra minutes on your weakest skill today without comparing yourself to anyone."},
{tag:"Playing time",title:"Bench Season",ref:"Galatians 6:9",scene:"turf",
story:["You show up early, you work hard in practice, and on game day you’re still holding a clipboard. It’s hard to keep giving everything when it feels like nobody notices.","Paul wrote to people who were tired of doing the right thing without seeing results. His phrase for them was “due season.” Farmers don’t harvest the week they plant. The work goes into the ground first.","Bench seasons build things that starters sometimes skip: humility, encouragement, readiness. Keep showing up. The harvest comes, sometimes in a form you didn’t expect."],
q:"Where are you tempted to give less because you aren’t being seen? Who could you encourage from where you are?",
prayer:"God, I want to play. Keep me from growing bitter or lazy while I wait. Give me joy in the work and eyes to lift up my teammates. Amen.",
play:"Be the loudest encourager on your team today, in practice or from the sideline."},
{tag:"Winning",title:"Holding the Trophy Loosely",ref:"1 Corinthians 10:31",scene:"lights",
story:["Confetti, a medal around your neck, your name blowing up the group chat. Winning feels incredible, and it should. God is not embarrassed by your joy.","But the high fades fast. By Monday there’s a new opponent, and the same heart that was satisfied on Saturday is already hungry again. Paul’s advice covers both the ordinary and the epic: whatever you do, do it all to the glory of God.","Celebrate hard. Thank the people who got you there. Then hold the trophy loosely, because it was a gift, and the Giver is better than the gift."],
q:"When you win, who gets the credit in your head? How can you celebrate in a way that points beyond yourself?",
prayer:"Thank you, God, for the win and for a body that can compete. Keep me grateful and humble. Let my celebration point to you. Amen.",
play:"Thank one coach, trainer or teammate by name for their part in your success."},
{tag:"Identity",title:"Who Are You Without the Jersey?",ref:"Psalm 147:10-11",scene:"court",
story:["For a lot of athletes, the sport becomes the whole identity. You are the shooter, the sprinter, the starting QB. Then comes an injury, a cut or graduation, and suddenly you’re not sure who you are.","The psalmist says something surprising: God takes no pleasure in the legs of a man. He doesn’t dislike athletes. Your speed and your vertical just aren’t what make him love you. He delights in people who trust him and hope in his love.","Your sport is something you do. It is not the deepest thing about you. That frees you to play hard without your whole identity riding on every game."],
q:"If your sport ended tomorrow, what would you still know is true about you?",
prayer:"God, remind me that I am yours before I am anything else. Let me play freely, because my worth is already settled in you. Amen.",
play:"Write down three things about who you are that have nothing to do with sports."},
{tag:"Discipline",title:"Nobody Sees 5 A.M.",ref:"1 Corinthians 9:25",scene:"track",
story:["The alarm goes off before the sun. Cold weights, an empty track, legs still sore from yesterday. Nobody posts this part.","Paul knew the Isthmian Games, where athletes trained for months for a wreath of plants that wilted within days. He uses them as a model: they exercised self-control in everything. Then he points higher. If athletes go all in for a crown that fades, how much more can we commit to what lasts?","Your discipline matters. Let it shape your faith too: steady habits, prayer in the quiet, honesty when no one is checking."],
q:"What discipline from your training could you bring into your spiritual life this week?",
prayer:"Lord, give me strength for the unseen work. Make me as committed to you as I am to my sport, and keep my eyes on the crown that lasts. Amen.",
play:"Pair one part of your training with prayer, like praying through your warm-up."},
{tag:"Teammates",title:"Iron Sharpens Iron",ref:"Proverbs 27:17",scene:"pool",
story:["The best teammates are not always the ones who make you comfortable. They push you in drills, call you out when you’re coasting, and pick you up when you’re down.","Sharpening involves friction and sparks. Healthy teams have hard conversations, but those conversations come from people who want each other to get better.","Be that teammate. And let others sharpen you, even when it stings a little."],
q:"Who sharpens you right now? Who are you sharpening?",
prayer:"God, thank you for my teammates. Help me be honest and kind, hard to coast around and easy to trust. Build our team into something that reflects you. Amen.",
play:"Give one teammate a specific, honest compliment and one specific word of encouragement."},
{tag:"Mistakes",title:"Next Play",ref:"Philippians 3:13-14",scene:"turf",
story:["Coaches have a phrase for after a mistake: next play. Fumble, double fault, own goal. You can’t fix it now, so you reset and compete on the next snap.","Paul had a long list of things he could regret. His approach: forget what is behind and stretch toward what is ahead. He doesn’t pretend the past didn’t happen. He just refuses to let it call the next play.","God’s grace covers what’s behind you. That frees you to put your full attention on the goal in front of you."],
q:"What mistake keeps replaying in your head? What would “next play” look like for it?",
prayer:"Jesus, I give you the mistakes I keep replaying. Thank you that your grace is bigger than my worst moments. Help me press on. Amen.",
play:"Build a 3-second reset into your game today: one breath, one word, refocus."},
{tag:"Burnout",title:"Running on Empty",ref:"Matthew 11:28",scene:"summit",
story:["School, practice, lifting, film, travel, recovery, repeat. Some weeks the love that got you into this sport feels gone, and you’re just surviving.","Jesus didn’t say “try harder.” He said, “Come to me, and I will give you rest.” Rest is not weakness. Every good training plan builds in recovery.","If you’re exhausted, tell someone you trust: a coach, a parent, a counselor. Then take the rest Jesus offers, in your body and in your soul."],
q:"Where do you feel most worn down right now? What would real rest look like this week?",
prayer:"Jesus, I’m tired. I bring you all of it. Give me the rest I can’t manufacture, and help me find joy in this sport again. Amen.",
play:"Protect eight hours of sleep tonight and take ten phone-free minutes to be still."},
{tag:"Endings",title:"Senior Night",ref:"2 Timothy 4:7",scene:"lights",
story:["Every career ends. Senior night, a final race, a last whistle. The jersey gets folded and the locker gets cleaned out.","Near the end of his life Paul looked back and said, “I have fought the good fight. I have finished the course. I have kept the faith.” He did not say he won every race. He said he finished and stayed faithful.","That is the scoreboard that matters most. Whatever season you’re in, run it so you can say the same."],
q:"When your sport ends, what do you want to be able to say about how you played and who you were?",
prayer:"God, thank you for every season you’ve given me in this sport. Help me finish well, stay faithful, and step into what’s next with trust. Amen.",
play:"Write a short note to your future self about how you want to finish this season."},
{tag:"Motivation",title:"Audience of One",ref:"Colossians 3:23",scene:"pool",
story:["Scouts in the stands, a coach with a clipboard, parents filming. It’s easy to play for whoever is watching and coast when no one is.","Paul says to work heartily, as for the Lord and not for people. That changes every rep. The sprint at the end of practice counts. The loose ball you chase in a blowout counts. Someone is always watching who cares about your heart more than your stat line.","Playing for an audience of one also takes the pressure off. You don’t have to impress everyone. You get to give your best to the One who already loves you."],
q:"Who do you usually play for? What changes if you play for God first?",
prayer:"Lord, today I play for you. Let my effort be the same whether the stands are full or empty. Amen.",
play:"Give full effort on one drill you usually coast through."},
{tag:"Pain",title:"Pain With a Purpose",ref:"Romans 5:3-4",scene:"track",
story:["Conditioning day. Lungs burning, legs shaking, coach blowing the whistle for one more. Every athlete learns that improvement lives on the other side of discomfort.","Paul describes a progression that works like a training block: suffering produces perseverance, perseverance produces proven character, and character produces hope. The hard thing builds something you can’t get any other way.","Not all pain is good. Injuries and mistreatment are not things to push through quietly, so tell someone. But the honest, hard work of growing is never wasted with God."],
q:"What hard thing are you going through that could be building endurance in you?",
prayer:"God, help me see the purpose in the hard days. Build perseverance, character and hope in me, and give me wisdom to know when to push and when to ask for help. Amen.",
play:"On your toughest rep today, pray one word: Build."},
{tag:"Preparation",title:"Built Before the Storm",ref:"Matthew 7:24-25",scene:"summit",
story:["Nobody builds a foundation during the game. By the time the lights come on, the work is already done or it isn’t. Footwork, conditioning, film study: all of it gets laid down in empty gyms months before anyone is watching.","Jesus told a story about two builders. Same rain, same floods, same wind. One house stood and one fell, and the difference was not the weather. It was what each builder did before the weather showed up. The wise one heard Jesus’ words and actually did them.","Faith works like preseason. Prayer, scripture and obedience in the quiet weeks are what hold you up when the injury, the cut or the loss hits. Build now, so you are ready then."],
q:"What storm could hit your season? What is one way you can strengthen your foundation this week, before it comes?",
prayer:"Lord, help me build on you before the hard days come. Make my faith something I practice, not just something I hear. When the storm hits, let me stand with courage. Amen.",
play:"Read one section of Matthew 5–7 today and pick one line to actually do before practice ends."},
{tag:"Worry",title:"Leave Tomorrow With God",ref:"Matthew 6:34",scene:"track",
story:["It’s Wednesday and you’re already playing Saturday’s game in your head. The matchup, the scouts, what happens if you choke. It feels like getting ready. Mostly it drains you before you ever step on the field.","Jesus spoke plainly about this: don’t be anxious for tomorrow, because today has enough of its own. He isn’t against preparing. He is against carrying a weight that hasn’t arrived yet, one you were never meant to carry alone.","Great athletes live in the present rep. You can’t make the next play while your mind is on the one after it. Trust God with Saturday, and give today everything you have."],
q:"What future game, tryout or decision is taking up space in your head? What would it look like to hand it to God today?",
prayer:"God, I give you tomorrow. Quiet the what-ifs in my head. Help me show up fully for today’s practice, today’s class and today’s people. Amen.",
play:"When a worry about the future shows up today, tell yourself “that’s tomorrow’s” and refocus on the drill in front of you."}

const FULL = {"Matthew 22:37": [["New year, new goals. Most athletes write down what they want to improve: speed, strength, stats. Few write down how they want to love God.", "When someone asked Jesus which commandment was the greatest, he said, “You shall love the Lord your God with all your heart, with all your soul, and with all your mind.” All of it. Not the leftovers after practice and school.", "Loving God fully doesn’t mean quitting your sport. It means your heart, your thinking and your daily choices all belong to him, including how you train and compete."], "God, I want to love you with everything this year: my heart, my soul and my mind. Show me the parts of my life I’ve held back from you. Amen.", "Write one spiritual goal for this year next to your athletic goals."], "Numbers 23:19": [["Balaam, a prophet hired to curse Israel, ended up declaring this instead: “God is not a man, that he should lie, nor a son of man, that he should repent. Has he said, and he won’t do it? Or has he spoken, and he won’t make it good?”", "People will let you down. God won’t. Every promise he has made, to be with you, to provide for you, to never leave you, he will keep."], "God, thank you that you never lie and never break your word. When people disappoint me, help me hold on to your promises. Amen.", "Find one promise of God in scripture and write it somewhere you’ll see it every day."], "Deuteronomy 8:18": [["After a breakout season, it’s tempting to believe you did it all yourself. The hours you put in were real. The sacrifice was real.", "Moses warned Israel that when they prospered, they might forget God and say, “My power and the might of my hand has gotten me this wealth.” Instead, he told them, “You shall remember Yahweh your God, for it is he who gives you power.”", "Your work matters, but the ability to do the work came from God: your body, your coordination, your health and the people who helped you. Remember the Giver."], "God, every ability I have came from you. Keep me humble and grateful, and help me never forget where my strength comes from. Amen.", "List three abilities you have and thank God specifically for each one."], "1 Corinthians 15:57": [["Victory feels amazing. The final whistle, the celebration, the trophy lifted high. But every championship eventually becomes old news.", "Paul writes about a different kind of victory: “Thanks be to God, who gives us the victory through our Lord Jesus Christ.” He’s talking about victory over sin and death, the greatest opponents anyone faces.", "Paul wrote this at the end of the longest chapter in the Bible about the resurrection. He had just taunted death itself: “Death, where is your sting? Hades, where is your victory?” For Paul, the empty tomb meant the worst opponent humanity has ever faced had already lost. Every other victory, including the ones on your field, sits under that one.", "That victory is a gift, not something you earn. And unlike a trophy, it never fades. Celebrate your wins on the field, but remember the win that matters most has already been secured."], "Thank you, Jesus, for the victory you won for me. Help me celebrate that more than any win on the field. Amen.", "After your next win, take a moment to thank God for the victory that lasts forever."], "Hebrews 12:12-13": [["Rehab is slow. Weak knees, sore muscles, limited motion. Every small step feels like a big effort.", "Hebrews says, “Therefore lift up the hands that hang down and the feeble knees, and make straight paths for your feet, so what is lame may not be dislocated, but rather be healed.” It sounds like a physical therapy plan, but it’s about spiritual strength during hard times.", "When you’re worn down, physically or emotionally, God calls you to keep moving, carefully and steadily, toward healing. Don’t give up on the process."], "God, strengthen my weak places, in my body and my faith. Help me take steady steps toward healing. Amen.", "Do your rehab or recovery routine today with full effort, and pray during it."], "Psalm 56:3": [["David wrote, “When I am afraid, I will put my trust in you.” He didn’t say “if.” He said “when.” David faced giants and armies, and he still felt fear. What made him brave wasn’t the absence of fear. It was where he put his trust.", "When fear shows up, you don’t have to pretend it isn’t there. Name it, then turn it into trust. Fear becomes a signal to lean on God."], "God, when I am afraid, I will trust you. Turn every fear into a reminder to lean on you. Amen.", "The next time you feel fear, say “When I am afraid, I will trust in you” out loud or under your breath."], "Psalm 63:1": [["You know real thirst. After sprints in the heat, your body wants water more than anything else. Nothing else matters until you drink.", "David wrote this in the wilderness: “God, you are my God. I will earnestly seek you. My soul thirsts for you. My flesh longs for you, in a dry and weary land, where there is no water.”", "What are you thirsty for? Success, attention, a starting spot? Those can’t satisfy the deepest thirst. Only God can. Seek him like water after a hard workout."], "God, make me thirsty for you. Help me seek you earnestly and find my deepest satisfaction in you. Amen.", "Every time you drink water today, say a short prayer thanking God for satisfying your soul."], "Psalm 28:7": [["Think back to a time God clearly helped you. The healing that came faster than expected. The friend who showed up at the right time. The game you somehow found the strength to finish.", "David wrote, “Yahweh is my strength and my shield. My heart has trusted in him, and I am helped. Therefore my heart greatly rejoices. With my song I will thank him.”", "Think about the way a team celebrates after a comeback. The joy is bigger because everyone remembers how bad it looked at halftime. Gratitude to God works the same way. When you remember how hopeless something felt before he helped you, your thanks gets louder. David’s heart “greatly rejoices” because he never forgot where he had been.", "Trust leads to help, and help leads to joy. When you remember how God has helped you, gratitude rises naturally. Don’t let those moments fade from your memory."], "God, you are my strength and shield. Thank you for every time you’ve helped me. Let my heart rejoice in you today. Amen.", "Tell someone today about a time God helped you."], "Philippians 4:11-12": [["Philippians 4:13 is on a lot of eye black and locker room walls: “I can do all things through Christ.” But the verses right before it change its meaning.", "Paul writes, “I have learned in whatever state I am, to be content in it. I know how to be humbled, and I know also how to abound. In any and all circumstances I have learned the secret both to be filled and to be hungry.”", "The “all things” Paul could do was be content, whether he had plenty or nothing. That’s the strength Christ gives: peace in the starting lineup or on the bench, in a winning season or a losing one."], "Jesus, teach me the secret of contentment. Whether I have a lot or a little, help me find my peace in you. Amen.", "Name one thing about your current situation that you’re not content with, and thank God for something good in it."], "1 Peter 4:10": [["Your athletic gift is real. Speed, strength, vision, touch. But God doesn’t give gifts just so you can collect trophies.", "Peter writes, “As each has received a gift, employ it in serving one another, as good managers of the grace of God in its various forms.” Your gifts are on loan from God, and they’re meant to bless others.", "Maybe you can coach younger kids, help a teammate improve, use your platform to speak up for someone or serve your community. Use what God has given you to build up others."], "God, thank you for the gifts you’ve given me. Show me how to use them to serve others, not just myself. Amen.", "Use your skill to help someone else improve this week: a younger athlete, a teammate or a sibling."], "Luke 12:25": [["You can spend hours worrying about the depth chart, the next game, your future in the sport or your family’s situation. It feels like you’re doing something.", "Jesus asked, “Which of you by being anxious can add a cubit to his height?” Worry doesn’t make you taller, faster or more prepared. It just drains your energy and steals your joy.", "Jesus told this to a crowd of ordinary people: farmers, fishermen and day laborers who genuinely didn’t know where their next meal was coming from. Their worries were far more serious than playing time. Still he told them to look at the ravens and the lilies. God feeds birds that don’t plant and clothes flowers that don’t sew. You are worth far more than either.", "Jesus pointed to birds and flowers that God feeds and clothes. If he cares for them, he’ll care for you. Let go of what you can’t control, and give your energy to what you can."], "God, my worry isn’t adding anything to my life. Help me trust you and put my energy into what you’ve given me to do today. Amen.", "When you catch yourself worrying today, ask, “Can I do anything about this right now?” If not, hand it to God."], "Proverbs 19:21": [["You had the whole path mapped out. Start as a sophomore, earn all-conference by junior year, sign with your dream school as a senior. Then a coaching change, a torn ligament or a family move scrambled everything.", "Proverbs says, “There are many plans in a man’s heart, but Yahweh’s counsel will prevail.” The writer isn’t saying planning is wrong. Elsewhere Proverbs praises careful planning. He’s saying that when your plans and God’s purpose collide, God’s purpose is the one that stands.", "That can be frustrating in the moment. But it’s also a relief. You’re not the only one steering. When your plan falls apart, God’s purpose for you hasn’t. Hold your plans with an open hand and ask him to show you what he’s doing."], "God, I made my plans, and some of them fell apart. I trust that your purpose for me still stands. Show me what you’re doing. Amen.", "Write down the plan that changed, and next to it write one good thing that has come from the change."], "Isaiah 6:8": [["Isaiah didn’t feel qualified. Moments earlier he had cried out that he was a man of unclean lips. But God cleansed him, and then he volunteered.", "God might be asking you to step into something: leading your team, standing up for someone, sharing your faith or making a hard change. You don’t have to feel ready. You just have to be willing."], "God, here I am. I’m not perfect, but I’m willing. Send me where you want me to go. Amen.", "Volunteer for something this week that you’d usually avoid."], "Genesis 28:15": [["Jacob was running away from home after betraying his brother. He slept alone in the wilderness with a stone for a pillow. And there, God met him and said, “Behold, I am with you, and will keep you, wherever you go.”", "You may feel far from home: a new school, a new team, a long road trip, or a college far from family. Loneliness can hit hard.", "God’s promise to Jacob is the same promise he makes to you. Wherever you go, he goes with you. You are never truly alone, even in the strangest hotel room or the emptiest locker room."], "God, thank you that you go with me wherever I go. When I feel lonely or far from home, remind me that you’re here. Amen.", "Next time you travel or feel out of place, pray Genesis 28:15 before you go to sleep."], "Isaiah 46:4": [["Every career ends. One day you’ll play your last game, take off the jersey for the final time and walk out of a locker room you won’t come back to. Many athletes struggle with who they are after that.", "God told Israel, “Even to old age I am he, and even to gray hairs I will carry you. I have made, and I will bear. Yes, I will carry, and will deliver.” He contrasted himself with idols that had to be carried around on animals. Israel didn’t carry God. God carried them.", "In the verses around this one, Isaiah mocks the idols of Babylon. They had to be loaded onto carts and pulled by tired animals whenever the city moved. People carried their gods. Then God says the opposite is true of him: he carries his people, from birth to gray hair. You don’t have to hold your faith together by your own strength. He holds you.", "God isn’t only with you during your peak years. He made you, he carries you through this season and he’ll still be carrying you when your hair is gray and your playing days are a memory. Your value doesn’t retire."], "God, thank you that you carry me through every season of life. Help me trust you with the future beyond my sport. Amen.", "Ask an older athlete or coach how God carried them after their playing days ended."], "1 Samuel 17:45": [["Goliath walked out with a sword, a spear and a javelin. David walked out with a sling and five stones. Everyone expected David to lose.", "David said, “You come to me with a sword, with a spear, and with a javelin; but I come to you in the name of Yahweh of Armies.” David wasn’t relying on his gear or his size. He was relying on the name he represented.", "When you compete, whose name do you carry? Your own? Your school’s? Your family’s? Above all, you carry the name of God. Play like it."], "God, I want to represent your name in everything I do. Give me courage that comes from you, not from my own strength. Amen.", "Before your next competition, pray, “I come in the name of the Lord.”"], "Psalm 34:8": [["David wrote, “Oh taste and see that Yahweh is good. Blessed is the man who takes refuge in him.” He wrote this after escaping real danger. He wasn’t repeating something he’d heard. He was describing what he had experienced.", "Faith isn’t just knowing facts about God. It’s experiencing him for yourself: in prayer, in worship, in scripture and in trusting him with real decisions. The more you taste his goodness, the more you’ll want."], "God, I don’t want to know about you only secondhand. Help me taste and see your goodness for myself. Amen.", "Spend ten minutes today in prayer or worship and pay attention to how God meets you there."], "Colossians 3:12": [["When you put on your team’s uniform, you represent something bigger than yourself. People know whose side you’re on just by looking at you.", "Paul writes, “Put on therefore, as God’s chosen ones, holy and beloved, a heart of compassion, kindness, lowliness, humility, and perseverance.” Notice how he describes you first: chosen, holy and beloved. You put on these qualities because of who you already are, not to earn that identity.", "Compassion, kindness, humility, gentleness and patience are the uniform of God’s team. You put on your jersey before every game. Put these on every morning too, so people can tell who you belong to."], "God, thank you that I’m chosen and loved. Help me put on compassion, kindness, humility and patience today. Amen.", "As you put on your practice gear today, pray through each quality in Colossians 3:12."], "Ecclesiastes 9:10": [["Half effort always shows up on film. The jog instead of the sprint, the lazy closeout, the rep you cut short when the coach looked away. Coaches notice, and so do teammates.", "Ecclesiastes says, “Whatever your hand finds to do, do it with your might.” The writer is reflecting on how short life is. You won’t get these days back, so give your full effort to what’s in front of you now.", "The writer of Ecclesiastes was a king who had tried everything: wealth, pleasure, building projects and wisdom. Much of the book wrestles with how short and uncertain life is. His conclusion isn’t to give up. It’s to throw yourself fully into the good work in front of you while you can. Your playing days are limited. That’s a reason to give them everything.", "That doesn’t mean burning yourself out or never resting. It means when you work, really work. Bring your full strength to practice, to class and to whatever task God puts in your hands today."], "God, life is short. Help me give my full effort to whatever you put in front of me today. No half r
