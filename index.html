 prayer. Name what you’re anxious about, thank God for what he’s already done, and hand it to him. Peace doesn’t come from controlling the outcome. It comes from God guarding your heart."], "God, here is what I’m anxious about. I’m handing it to you with thanks for what you’ve already done. Guard my heart and mind with your peace. Amen.", "Tonight, write down every worry in your head, pray over the list, then close the notebook and go to sleep."], "Ephesians 6:11": [["You wouldn’t step onto the field without the right gear. Pads, cleats, tape, a mouthguard. Equipment protects you so you can compete without getting hurt.", "Paul says, “Put on the whole armor of God, that you may be able to stand against the wiles of the devil.” He then describes the belt of truth, the breastplate of righteousness, shoes of peace, the shield of faith, the helmet of salvation and the sword of the Spirit, which is God’s word.", "Roman soldiers didn’t put on armor once and leave it on for life. They put it on before every battle and maintained it carefully. Spiritual armor works the same way. Yesterday’s prayer doesn’t protect today. Truth, faith and God’s word need to be put on fresh each day, especially on days you know will be hard.", "Spiritual battles are real: temptation, discouragement and lies about who you are. Gear up every day. Put on truth. Hold up faith. Carry scripture. You’ll be ready when the hits come."], "God, help me put on your full armor today. Protect my mind, my heart and my choices. Make me ready for whatever comes against me. Amen.", "Memorize one verse this week to use as your “sword” when temptation or discouragement hits."], "2 Samuel 22:35": [["Your hands learned their skill slowly. Thousands of catches, shots, swings and grips. Nobody is born with perfect technique. It gets trained in.", "David sang, “He teaches my hands to war, so that my arms bend a bow of bronze.” David was a skilled warrior, but he credited God as his trainer. The same God who gave him strength also taught him skill.", "God isn’t against your training. He’s the coach behind it. When you practice, you’re developing gifts he gave you. Treat practice as something you do with God, not just for your sport."], "Lord, you are my trainer. Thank you for the skills I’ve developed. Keep teaching me, in my sport and in my life. Amen.", "Before your next practice, ask God to train your hands and your heart, then work on one specific skill with full focus."], "1 John 1:9": [["John writes, “If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness.” Confession means agreeing with God about what happened. Forgiveness is his promise in return.", "You don’t have to hide it or carry it anymore. Tell God honestly. And if you’ve hurt someone, make it right with them too. A clean slate is waiting."], "God, I confess what I’ve done. Thank you that you are faithful to forgive and cleanse me. Help me walk forward free. Amen.", "Tell God specifically what you need to confess today, and if someone else was hurt, take one step to make it right."], "Hebrews 4:16": [["After a bad game, some athletes avoid the coach’s office. After a bad week, some believers avoid God. Shame makes us want to hide.", "Hebrews says, “Let us therefore draw near with boldness to the throne of grace, that we may receive mercy, and may find grace for help in time of need.” Notice it’s a throne of grace, not a throne of judgment. And you’re invited to come boldly.", "Jesus understands weakness. He was tempted in every way, yet without sin. He’s not waiting to lecture you. He’s waiting to help. The time you most want to hide is the time you most need to come."], "Jesus, I don’t want to hide from you anymore. I come boldly to your throne of grace. I need your mercy and help right now. Amen.", "The next time you mess up, go to God in prayer within the hour instead of avoiding him."], "Hebrews 10:24": [["The best training partners make you better. They push the pace when you’re slowing down. They challenge you to one more rep. They don’t let you settle.", "Hebrews says, “Let’s consider how to provoke one another to love and good works.” The word “provoke” usually means stirring someone up to anger. Here it means stirring someone up to love and doing good.", "The next verse says, “not forsaking our own assembling together, as the custom of some is, but exhorting one another.” Faith wasn’t designed to be a solo sport. You need people who show up for you, and they need you to show up for them. Isolation makes everyone weaker.", "Be that kind of teammate in your faith too. Invite a friend to a Bible study. Challenge each other to pray. Hold each other accountable. Faith grows faster with a partner pushing you."], "God, help me push my teammates toward love and good works, and give me friends who push me too. Amen.", "Invite one teammate to read a devotional or pray with you once this week."], "Psalm 139:14": [["Too short. Too slow. Too skinny. Too big. Sports can make you hyper-aware of everything you wish you could change about your body.", "David prayed, “I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well.” God didn’t make you by accident. He made you with care, down to the details you don’t like.", "Training to improve is good. Hating the body God gave you is not. Thank him for how he made you, and use what you’ve been given with gratitude."], "God, thank you for how you made me. Help me see my body the way you see it: wonderfully made. Help me care for it with gratitude. Amen.", "Thank God out loud today for three things your body can do."], "Psalm 27:1": [["David wrote, “Yahweh is my light and my salvation. Whom shall I fear? Yahweh is the strength of my life. Of whom shall I be afraid?” He had real enemies. He wasn’t pretending danger didn’t exist. He was measuring it against God.", "When you look at your fear next to God, it shrinks. The opponent is still big, the moment is still real, but you’re not facing it alone. The strongest one in the arena is on your side."], "Lord, you are my light and my strength. When I’m afraid, help me remember who you are. Shrink my fear by showing me your greatness. Amen.", "Name the thing you’re most afraid of this week, and say Psalm 27:1 over it."], "Ephesians 3:20": [["Some athletes are afraid to dream big because it might not happen. It feels safer to aim low and avoid disappointment.", "Paul writes that God “is able to do exceedingly abundantly above all that we ask or think, according to the power that works in us.” Exceedingly abundantly above. Not just what you ask, but more than you can imagine.", "This doesn’t mean God will give you every trophy you want. It means his plans for you are bigger, not smaller, than yours. Dream boldly and trust him with the results."], "God, you can do far more than I can imagine. Help me dream big and trust you completely with the outcome. Amen.", "Write down the biggest goal you’ve been afraid to say out loud, and pray over it."], "2 Samuel 22:33": [["Sometimes the path feels crooked. Plans fall through, coaches change, injuries reset your progress. It’s hard to find steady footing.", "David sang, “God is my strong fortress. He makes my way perfect.” He wrote it after years on the run from King Saul, after war and loss. He looked back and saw that God had been steadying his path all along.", "This song appears almost word for word in Psalm 18. David sang it “in the day that Yahweh delivered him out of the hand of all his enemies, and out of the hand of Saul.” It’s a victory song written at the end of a long, hard road. He looked back and could finally see God’s hand in every step.", "You may not see it now, but God is guiding your steps. He is a fortress around you and a guide in front of you. Keep walking, and trust him to straighten the road."], "God, you are my strong fortress. When my path feels crooked, steady my steps and lead me forward. Amen.", "Look back at one hard season and write down how God guided you through it."], "Matthew 25:21": [["Everyone wants the big moment: the game-winner, the championship, the scholarship. Few people want to be faithful in the small things that come before.", "In Jesus’ parable, the master told his faithful servant, “Well done, good and faithful servant. You have been faithful over a few things, I will set you over many things.” Faithfulness with little leads to trust with much.", "Your warmups, your classwork, your attitude at a boring practice: these are the “few things.” Do them well. God is preparing you for more than you can see."], "Lord, help me be faithful in the small things today. I want to hear you say, “Well done.” Amen.", "Do your warmup today with the same focus you’d bring to a championship."], "Galatians 1:10": [["Paul asked, “For am I now seeking the favor of men, or of God? Or am I striving to please men? For if I were still pleasing men, I wouldn’t be a servant of Christ.” He had to choose his audience.", "People’s approval is fickle. It rises and falls with your last performance. God’s love is constant. Play for him, and you’ll be free from chasing a crowd that can never be satisfied."], "God, I want to play for your approval, not people’s. Free me from needing to impress anyone but you. Amen.", "Before your next competition, say quietly, “This is for you, God.”"], "Job 1:21": [["It’s easy to praise God after a win. The real test comes when everything is taken away: the season, the starting spot, a loved one.", "Job lost his wealth and his children in a single day. His response was, “Yahweh gave, and Yahweh has taken away. Blessed be Yahweh’s name.” He grieved deeply. He tore his robe. But he still worshiped.", "Faith doesn’t mean pretending loss doesn’t hurt. It means trusting God even when it does. Praising God in a losing season shows what your faith is really built on."], "God, you give and you take away. Help me trust you in loss as much as in victory. Blessed be your name. Amen.", "After your next loss or disappointment, thank God for one thing before you complain about anything."], "Proverbs 4:25-26": [["A sprinter who looks at the lane next to them slows down. A quarterback who stares at the pass rush misses the open receiver. Focus is everything.", "Proverbs says, “Let your eyes look straight ahead. Fix your gaze directly before you. Make the path of your feet level. Let all of your ways be established.” Distractions pull you off course one glance at a time.", "The passage keeps going: “Don’t turn to the right hand nor to the left. Remove your foot from evil.” Notice how physical the language is: eyes, gaze, feet and path. Proverbs treats the spiritual life like an athlete treats a race, where small drifts in direction add up to a very different finish.", "Your phone, comparison, drama and doubts all compete for your attention. Decide what deserves your focus, and train your eyes to stay there."], "God, help me keep my eyes forward and my focus on what matters. Guard me from distractions that pull me off course. Amen.", "Turn your phone off for one hour of focused training or study today."], "2 Kings 6:16": [["Elisha’s servant woke up to see an enemy army surrounding the city. He panicked. Elisha calmly said, “Don’t be afraid; for those who are with us are more than those who are with them.”", "Then Elisha prayed, and the servant’s eyes were opened. The hills were full of horses and chariots of fire. God’s army had been there the whole time.", "On the road, in a hostile gym, when it feels like everyone is against you, remember that you’re never outnumbered. God’s presence is real even when you can’t see it."], "God, open my eyes to see that you are with me. When I feel outnumbered, remind me that your army is bigger. Amen.", "Before your next away game or hard situation, pray Elisha’s prayer: “Open my eyes, Lord.”"], "Matthew 19:26": [["Some goals look impossible: coming back from a major injury, making a team after getting cut, turning around a losing program, rebuilding a broken relationship.", "When the disciples asked who could possibly be saved, Jesus looked at them and said, “With men this is impossible, but with God all things are possible.” He wasn’t talking about sports. He was talking about the hardest thing of all: changing a human heart.", "If God can do that, he can handle what you’re facing. It may not happen the way you want, but nothing is beyond his power."], "God, this looks impossible to me. I trust that nothing is impossible for you. Work in this situation in your way. Amen.", "Write down the thing that feels impossible, and pray over it every day this week."], "Mark 5:36": [["The doctor’s report. The coach’s decision. The phone call from home. Some news hits like a punch.", "When Jairus heard that his daughter had died, Jesus turned to him and said, “Don’t be afraid, only believe.” Then he went to the house and raised her from the dead.", "While Jesus was on the way to Jairus’ house, he stopped for a woman who had been bleeding for twelve years. That delay might have cost Jairus everything, because during it, his daughter died. But Jesus wasn’t late. He told Jairus not to fear, kept walking and raised the girl to life. Delays aren’t denials with Jesus.", "Your situation may not be life and death, but fear grips the same way. Jesus speaks the same words to you: don’t be afraid, only believe. Hold on to him when the news is bad."], "Jesus, the news is scary. Help me not be ruled by fear. I choose to believe in you. Amen.", "The next time bad news comes, pause and pray before you react."], "Nehemiah 8:10": [["Somewhere along the way, a lot of athletes lose the joy. The game that used to be fun becomes pressure, expectations and stress.", "When the people of Israel heard God’s law and began weeping over their failures, Nehemiah told them, “Don’t be grieved, for the joy of Yahweh is your strength.” God’s joy wasn’t a reward for being perfect. It was fuel to keep going.", "Joy isn’t the absence of hard things. It’s the presence of God in them. Ask God to give you back the joy, and watch how it strengthens you."], "God, I’ve lost the joy I used to have. Give it back to me. Let your joy be my strength today. Amen.", "Play one drill or game today just for the fun of it, like you did when you were a kid."], "Joshua 24:15": [["Athletes serve something too. Some serve their stats. Some serve a scholarship. Some serve the approval of a parent or coach. Some serve their own image. All of those masters eventually let you down.", "Joshua finished with, “But as for me and my house, we will serve Yahweh.” Make that choice today, and again tomorrow. Let your sport be part of how you serve God."], "God, I choose to serve you. Help me play my sport in a way that honors you more than anything else. Amen.", "Write down what you have been serving through your sport, and recommit it to God."], "Psalm 121:1-2": [["Under pressure, most people look around. They look at the scoreboard, the crowd, the coach or their phone for reassurance.", "The psalmist wrote, “I will lift up my eyes to the hills. Where does my help come from? My help comes from Yahweh, who made heaven and earth.” Pilgrims sang this on the way to Jerusalem, looking up at the hills ahead.", "Christmas reminds us that help came down. The God who made heaven and earth came as a baby to help us. When pressure builds, look up first. Your help comes from him."], "God, my help comes from you. When I’m under pressure, help me look up before I look around. Amen.", "In your next pressure moment, literally lift your eyes for a second and remember where your help comes from."], "Romans 8:31": [["On Christmas, we remember that God didn’t stay distant. He came close as a baby named Jesus. The God of the universe chose to be with us.", "Paul asks, “If God is for us, who can be against us?” Then he answers, “He who didn’t spare his own Son, but delivered him up for us all, how would he not also with him freely give us all things?”", "Paul follows this with a string of questions: Who will bring a charge against God’s chosen? Who condemns? Who will separate us from Christ’s love? Each time, the answer is no one, because God justifies, Christ intercedes and nothing can separate us. It reads like a team list with nobody left on the other side.", "If God gave his Son for you, you can be sure he is for you. Critics, opponents, injuries and doubts can’t change that. You have the ultimate home-field advantage."], "Thank you, God, for sending Jesus. Thank you that you are for me. Let that truth give me confidence today. Amen.", "Thank God today for coming close in Jesus, and tell one person why Christmas matters to you."], "1 Samuel 30:6": [["David came home to find his town burned and his family taken. His own men were so upset that they talked about stoning him. It was the lowest point of his life.", "Then the Bible says, “But David strengthened himself in Yahweh his God.” He didn’t wait for someone to encourage him. He went straight to God.", "When everything falls apart, the first place you turn matters. Your phone, your friends or your anger can’t hold you up. Go to God first, and let him strengthen you from the inside."], "God, when everything falls apart, help me run to you first. Strengthen me when no one else can. Amen.", "The next time you feel like everything is falling apart, spend five minutes in prayer before you text anyone."], "Philippians 2:14": [["Paul writes, “Do all things without complaining and arguing, that you may become blameless and harmless, children of God without defect.” He goes on to say that people who live this way shine like stars in a dark world.", "Complaining spreads fast on a team and drags everyone down. Instead of complaining, find something to be thankful for. Instead of arguing, look for a solution."], "God, help me stop complaining. Replace grumbling with gratitude and arguments with solutions. Amen.", "Catch yourself every time you start to complain today, and replace it with something you’re grateful for."], "Hosea 6:3": [["Think about how hard you pursue your sport. The hours, the sweat, the sacrifice, the film, the early mornings.", "Hosea said, “Let’s acknowledge Yahweh. Let’s press on to know Yahweh. As surely as the sun rises, Yahweh will appear.” God doesn’t hide from people who pursue him. He shows up as reliably as the sunrise.", "Imagine pursuing God with the same intensity you bring to your sport. Not to earn his love, but because he is worth knowing."], "God, I want to know you more. Help me pursue you with the same passion I give to my sport. Amen.", "Set a daily time this week to pursue God, and treat it as seriously as practice."], "Job 42:2": [["Job lost almost everything and spent most of the book asking God why. When God finally spoke, he didn’t explain Job’s suffering. He showed Job how vast and powerful he is.", "Job answered, “I know that you can do all things, and that no purpose of yours can be restrained.” Job didn’t get all his questions answered. But he saw how big God was, and that was enough.", "Job’s story ends with God restoring him, giving him a new family and twice as much as he had before. But that restoration came after his confession, not before. He trusted God’s purposes before he saw how things would turn out. That’s the harder, more valuable kind of trust.", "Maybe you’re facing something you can’t fix or understand. Hand it to God. Nothing can stop what he has planned."], "God, I know you can do all things. I trust your purposes, even when I don’t understand them. Amen.", "Write down the situation that feels impossible, and pray, “Your purpose will stand.”"], "1 Corinthians 16:14": [["Competition can bring out the worst in people: trash talk, cheap shots, jealousy and anger. It’s easy to think love has no place in sports.", "Paul writes, “Let all that you do be done in love.” All. Not just at church. Not just at home. In every practice and every game.", "Competing in love means respecting your opponent, encouraging your teammates, controlling your temper and playing with integrity. It means seeing people as more important than the score."], "God, help me compete in love. Let my intensity be matched by kindness and respect. Amen.", "Shake hands and say “good game” to every opponent you face this week, and mean it."], "1 Chronicles 28:20": [["David told his son Solomon, “Be strong and courageous, and do it. Don’t be afraid, nor be dismayed, for Yahweh God, even my God, is with you. He will not fail you nor forsake you, until all the work for the service of Yahweh’s house is finished.”", "Courage isn’t just a feeling. It’s doing the work. As you start a new year, don’t just set goals. Take the first step, trusting that God will be with you until the work is done."], "God, as I start a new year, help me be strong and courageous. Give me the strength to do the work you’ve given me. Amen.", "Write down one goal for the new year and take the first step toward it today."]};
const BANK = {"Faith": {"prayer": ["God, I want to trust you more than I trust my own strength. Grow my faith today, in practice, in class and in the quiet moments. Amen.", "Lord, when I can’t see how this works out, help me believe you are still good and still working. Amen.", "Father, you have never let me down. Help me lean on you today instead of figuring everything out myself. Amen."], "play": ["Before your first rep today, take ten seconds and tell God you trust him with the outcome.", "Text a teammate one verse that has helped you this week.", "Write today’s verse on athletic tape or your phone lock screen and read it before you compete."]}, "Courage": {"prayer": ["God, give me courage that comes from you, not from my stats. When fear shows up, remind me you are with me. Amen.", "Lord, I’m nervous about what’s ahead. Steady my heart and help me step forward anyway. Amen.", "Father, make me bold where I usually shrink back. Let my courage point to you. Amen."], "play": ["Do one thing today that scares you a little: ask for the ball, speak up in the huddle, or try the new move.", "Breathe in for four counts and out for six before your biggest moment today, and say, “God is with me.”", "Volunteer for the hardest drill or matchup in practice today."]}, "Discipline": {"prayer": ["Lord, give me strength for the unseen work today. Make me faithful in the small things. Amen.", "God, help me choose what’s right over what’s easy, in training and in my faith. Amen.", "Father, build discipline in me that lasts longer than this season. Amen."], "play": ["Add one extra set or ten extra minutes to your weakest area today.", "Set your alarm ten minutes early tomorrow and spend that time in prayer or scripture.", "Put your phone in another room for one full hour of focused work today."]}, "Purpose": {"prayer": ["God, show me why you placed me on this team and in this sport. Use me for something bigger than me. Amen.", "Lord, let my effort today point people to you. Amen.", "F rance in me that carries into every part of my life. Amen."], "play": ["On your toughest set today, focus only on finishing the next rep.", "Pick a one-word prayer to repeat when you’re exhausted, like “Strength” or “Help.”", "Encourage someone else who is struggling to finish a drill."]}, "Gratitude": {"prayer": ["Thank you, God, for a body that moves and a sport I get to play. Keep me grateful. Amen.", "Lord, I don’t want to take today for granted. Open my eyes to your gifts. Amen.", "Father, thank you for every coach, teammate and person who has invested in me. Amen."], "play": ["Thank a coach, trainer or parent in person today.", "Write down three things from today’s practice you’re grateful for.", "Before eating today, thank God for the fuel and the body it feeds."]}, "Worry": {"prayer": ["God, I give you the what-ifs in my head. Help me live in today. Amen.", "Lord, my mind keeps racing. Quiet it with your peace. Amen.", "Father, you hold my future. Help me let go of what I can’t control. Amen."], "play": ["When a worry comes up today, say “That’s yours, God” and refocus on the drill in front of you.", "Write down your biggest worry tonight, pray over it, and close the notebook.", "Take five slow breaths before practice and name one thing that is going well right now."]}, "Pressure": {"prayer": ["God, when the moment gets big, remind me you are bigger. Calm my body and steady my mind. Amen.", "Lord, win or lose today, I belong to you. Let that free me to compete. Amen.", "Father, take the weight of other people’s expectations off my shoulders. Amen."], "play": ["Build a short pre-performance routine that includes one sentence of prayer.", "Visualize your biggest moment going well, and picture God right beside you in it.", "Smile once during warmups today to remind yourself this is a gift."]}, "Mistakes": {"prayer": ["Jesus, thank you that my worst moment doesn’t define me. Help me move to the next play. Amen.", "Lord, I bring you the mistake I keep replaying.
