/* ---------- Dates ---------- */
const DAY=864e5;
function today(){const d=new Date();d.setHours(12,0,0,0);return d}
function shift(d,n){return new Date(d.getTime()+n*DAY)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const CUM=[0,31,60,91,121,152,182,213,244,274,305,335];
function yearIdx(d){return CUM[d.getMonth()]+d.getDate()-1}
function entryFor(d){const i=yearIdx(d),y=YEAR[i];if(y<DAILY.length)return DAILY[y];
 const s=SHORT[y-DAILY.length],b=BANK[s[1]],k=d.getFullYear()+i;
 const F=FULL[s[0]];if(F)return {ref:s[0],tag:s[1],title:s[2],story:F[0],q:s[4],prayer:F[1],play:F[2]};
 return {ref:s[0],tag:s[1],title:s[2],story:[s[3]],q:s[4],prayer:b.prayer[k%b.prayer.length],play:b.play[(k+1)%b.play.length]}}
const TITLES={};DAILY.forEach(e=>TITLES[e.ref]=e.title);SHORT.forEach(s=>TITLES[s[0]]=s[2]);
function streak(){let d=today(),s=0;if(!S.done[ymd(d)])d=shift(d,-1);while(S.done[ymd(d)]){s++;d=shift(d,-1)}return s}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function rg(c,x,y,r,stops){const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}

 if("back" in ds){openPlan=null;openDay=null;render();return}
 if(ds.day){const i=Number(ds.day);openDay=openDay===i?null:i;render();return}
 if(ds.complete){const i=Number(ds.complete),arr=S.plans[openPlan]||(S.plans[openPlan]=[]);if(!arr.includes(i)){arr.push(i);const pp=PLANS.find(x=>x.id===openPlan);if(arr.length>=pp.days.length){S.planRuns=S.planRuns||{};S.planRuns[openPlan]=(S.planRuns[openPlan]||0)+1}}persist();const p=PLANS.find(x=>x.id===openPlan);const nx=p.days.findIndex((_,k)=>!arr.includes(k));openDay=nx<0?null:nx;toast(`Day ${i+1} complete`);render();return}
 if(ds.restart){S.plans[ds.restart]=[];openDay=0;persist();toast("Plan restarted");render();window.scrollTo(0,0);return}
 if(ds.undo){const i=Number(ds.undo);S.plans[openPlan]=(S.plans[openPlan]||[]).filter(x=>x!==i);persist();render();return}
 if(ds.moment){moment=ds.moment;render();return}
 if(ds.scene){imgScene=ds.scene;document.querySelectorAll(".sw").forEach(s=>s.setAttribute("aria-pressed",s.dataset.scene===imgScene));drawImage();return}
});
document.getElementById("closeSheet").onclick=closeImage;
document.getElementById("sheetDone").onclick=closeImage;
document.getElementById("sheetCopy").onclick=()=>copyText(verseText(imgRef));
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeImage()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeImage()});
let jt;document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.journal;if(!k)return;const d=new Date(k+"T12:00");S.journal[k]={q:entryFor(d).q,a:e.target.value};clearTimeout(jt);jt=setTimeout(()=>{persist();const n=document.getElementById("jn");if(n)n.textContent="Saved on this device"},400)});

/* ---------- Install to home screen ---------- */
const IS_STANDALONE=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
const IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let installPrompt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;render()});
addEventListener("appinstalled",()=>{installPrompt=null;toast("Press On is on your home screen");render()});
const SHARE_ICON='<svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>';
function installCard(onToday){
 if(IS_STANDALONE)return "";
 if(onToday&&S.installDismissed)return "";
 let body;
 if(installPrompt) body=`<p>Install Press On on your home screen. It opens full screen, like any other app.</p><div class="row"><button class="btn" data-install>Install the app</button>${onToday?'<button class="btn ghost" data-dismiss-install>Not now</button>':""}</div>`;
 else if(IS_IOS) body=`<p>Put Press On on your home screen so it opens like an app:</p><ol><li>In Safari, tap the Share button ${SHARE_ICON}</li><li>Scroll down and tap <b>Add to Home Screen</b></li><li>Tap <b>Add</b></li></ol>${onToday?'<div class="row"><button class="btn ghost" data-dismiss-install>Got it</button></div>':""}`;
 else body=`<p>Put Press On on your home screen so it opens like an app: open your browser menu (⋮) and tap <b>Install app</b> or <b>Add to Home screen</b>.</p>${onToday?'<div class="row"><button class="btn ghost" data-dismiss-install>Got it</button></div>':""}`;
 return `<section class="install"><h3>Get the app</h3>${body}</section>`;
}
document.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
 if("install" in b.dataset&&installPrompt){installPrompt.prompt();try{await installPrompt.userChoice}catch(e){}installPrompt=null;render()}
 if("dismissInstall" in b.dataset){S.installDismissed=true;persist();render()}});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>{if(!pushEnabled())navigator.serviceWorker.register("OneSignalSDKWorker.js").catch(()=>{})});

/* ---------- Daily verse reminders (OneSignal web push) ----------
   Paste your OneSignal App ID between the quotes to switch reminders on. */
const ONESIGNAL_APP_ID = "7894042c-b6a7-4bba-a141-d1e7a294373b";
function pushEnabled(){return !!ONESIGNAL_APP_ID&&PUSH.supported&&location.protocol.startsWith("http")}
const PUSH={ready:false,on:false,error:"",supported:"Notification" in window&&"serviceWorker" in navigator&&"PushManager" in window};
function utcOffset(){return String(-new Date().getTimezoneOffset())}
function pushInit(){
 if(!ONESIGNAL_APP_ID||!PUSH.supported||!location.protocol.startsWith("http"))return;
 window.OneSignalDeferred=window.OneSignalDeferred||[];
 const s=document.createElement("script");s.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";s.defer=true;
 s.onerror=()=>{PUSH.error="Couldn’t reach the reminder service. Check your internet connection and reopen the app.";navigator.serviceWorker.register("OneSignalSDKWorker.js").catch(()=>{});render()};
 document.head.appendChild(s);
 setTimeout(()=>{if(!PUSH.ready&&!PUSH.error){PUSH.error="The reminder service didn’t respond. Close the app completely and open it again.";render()}},15000);
 OneSignalDeferred.push(async OneSignal=>{
  const scope=location.pathname.replace(/[^/]*$/,"");
  try{
   await OneSignal.init({appId:ONESIGNAL_APP_ID,serviceWorkerPath:scope.replace(/^\//,"")+"OneSignalSDKWorker.js",serviceWorkerParam:{scope},allowLocalhostAsSecureOrigin:true,autoResubscribe:true,notifyButton:{enable:false}});
   PUSH.ready=true;
   PUSH.on=!!OneSignal.User.PushSubscription.optedIn&&Notification.permission==="granted";
   if(PUSH.on){OneSignal.User.addTag("utc_offset",utcOffset());setTimeout(()=>{try{OneSignal.User.addTag("utc_offset",utcOffset())}catch(e){}},4000)}
   OneSignal.User.PushSubscription.addEventListener("change",e=>{PUSH.on=!!(e.current&&e.current.optedIn);render()});
   render();
  }catch(e){console.warn("Reminders unavailable",e);PUSH.error="Reminders couldn’t start: "+((e&&e.message)||e);render()}
 });
}
async function pushSet(want){
 if(PUSH.error){toast(PUSH.error);return}
 if(!PUSH.ready){toast("Reminders are still loading. Try again in a few seconds.");return}
 const OS=window.OneSignal;
 try{
  if(want){
   await OS.Notifications.requestPermission();
   if(Notification.permission!=="granted"){toast("Notifications are blocked. Turn them on for Press On in your phone’s settings.");return}
   await OS.User.PushSubscription.optIn();OS.User.addTag("utc_offset",utcOffset());setTimeout(()=>{try{OS.User.addTag("utc_offset",utcOffset())}catch(e){}},4000);
   PUSH.on=true;toast("You’ll get the daily verse at 6:00 a.m.");
  }else{await OS.User.PushSubscription.optOut();PUSH.on=false;toast("Daily verse reminder is off")}
 }catch(e){console.warn(e);PUSH.error="Couldn’t turn on reminders: "+((e&&e.message)||e);toast(PUSH.error)}
 S.pushAsked=true;persist();render();
}
function reminderCard(prompt){
 if(!ONESIGNAL_APP_ID)return "";
 if(prompt&&(PUSH.on||S.pushAsked||!PUSH.ready))return "";
 if(PUSH.error&&!prompt)return `<section class="card"><span class="label">Daily verse reminder</span><p>${PUSH.error}</p><p class="muted" style="font-size:13px">If this keeps happening, send this message to the Press On team.</p></section>`;
 if(IS_IOS&&!IS_STANDALONE)return prompt?"":`<section class="card"><span class="label">Daily verse reminder</span><p>To get the daily verse as a notification on iPhone, first add Press On to your home screen. Then open it from your home screen and turn the reminder on here.</p></section>`;
 if(!PUSH.supported)return "";
 const head=prompt?"Want this every morning?":"Daily verse reminder";
 const sid=(PUSH.ready&&window.OneSignal&&OneSignal.User.PushSubscription.id)||"";
 const text=PUSH.on?(sid?"On. The day’s verse arrives at 6:00 a.m. your time.":"Almost on. Your phone allowed notifications, but OneSignal hasn’t registered it yet. Close the app completely, wait a minute and open it again."):"Get the day’s verse as a notification at 6:00 a.m. your time.";
 const idline=PUSH.on?`<p class="muted" style="font-size:12px;word-break:break-all">${sid?"Device ID: "+sid:"Device ID: not registered yet"} · Notifications: ${typeof Notification!=="undefined"?Notification.permission:"unavailable"}</p>`:"";
 const btns=PUSH.on?`<button class="btn ghost block" data-push="off">Turn off reminder</button>`:`<div class="row"><button class="btn" data-push="on">Remind me daily</button>${prompt?'<button class="btn ghost" data-push-later>Not now</button>':""}</div>`;
 return `<section class="card"><span class="label">${head}</span><p>${text}</p>${idline}${btns}</section>`;
}
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
 if(b.dataset.push)pushSet(b.dataset.push==="on");
 if("pushLater" in b.dataset){S.pushAsked=true;persist();render()}});
pushInit();

/* ---------- Bible reader (World English Bible, one file per book in bible/) ---------- */
const BOOKS=[["genesis", "Genesis", 50], ["exodus", "Exodus", 40], ["leviticus", "Leviticus", 27], ["numbers", "Numbers", 36], ["deuteronomy", "Deuteronomy", 34], ["joshua", "Joshua", 24], ["judges", "Judges", 21], ["ruth", "Ruth", 4], ["1samuel", "1 Samuel", 31], ["2samuel", "2 Samuel", 24], ["1kings", "1 Kings", 22], ["2kings", "2 Kings", 25], ["1chronicles", "1 Chronicles", 29], ["2chronicles", "2 Chronicles", 36], ["ezra", "Ezra", 10], ["nehemiah", "Nehemiah", 13], ["esther", "Esther", 10], ["job", "Job", 42], ["psalms", "Psalms", 150], ["proverbs", "Proverbs", 31], ["ecclesiastes", "Ecclesiastes", 12], ["songofsolomon", "Song of Solomon", 8], ["isaiah", "Isaiah", 66], ["jeremiah", "Jeremiah", 52], ["lamentations", "Lamentations", 5], ["ezekiel", "Ezekiel", 48], ["daniel", "Daniel", 12], ["hosea", "Hosea", 14], ["joel", "Joel", 3], ["amos", "Amos", 9], ["obadiah", "Obadiah", 1], ["jonah", "Jonah", 4], ["micah", "Micah", 7], ["nahum", "Nahum", 3], ["habakkuk", "Habakkuk", 3], ["zephaniah", "Zephaniah", 3], ["haggai", "Haggai", 2], ["zechariah", "Zechariah", 14], ["malachi", "Malachi", 4], ["matthew", "Matthew", 28], ["mark", "Mark", 16], ["luke", "Luke", 24], ["john", "John", 21], ["acts", "Acts", 28], ["romans", "Romans", 16], ["1corinthians", "1 Corinthians", 16], ["2corinthians", "2 Corinthians", 13], ["galatians", "Galatians", 6], ["ephesians", "Ephesians", 6], ["philippians", "Philippians", 4], ["colossians", "Colossians", 4], ["1thessalonians", "1 Thessalonians", 5], ["2thessalonians", "2 Thessalonians", 3], ["1timothy", "1 Timothy", 6], ["2timothy", "2 Timothy", 4], ["titus", "Titus", 3], ["philemon", "Philemon", 1], ["hebrews", "Hebrews", 13], ["james", "James", 5], ["1peter", "1 Peter", 5], ["2peter", "2 Peter", 3], ["1john", "1 John", 5], ["2john", "2 John", 1], ["3john", "3 John", 1], ["jude", "Jude", 1], ["revelation", "Revelation", 22]];
const BIB={};let bibleMode="reader",biblePickBook=null;
function bookOf(name){const n=name.toLowerCase().replace(/\s+/g,"");const k=n==="psalm"?"psalms":n;return BOOKS.findIndex(b=>b[0]===k)}
function parseRef(ref){const m=ref.match(/^(.+) (\d+):(\d+)(?:-(\d+))?$/);if(!m)return null;const b=bookOf(m[1]);if(b<0)return null;return {b,ch:+m[2],from:+m[3],to:+(m[4]||m[3])}}
function bpos(){return S.bible||{b:bookOf("John"),ch:1}}
async function loadBook(b){const slug=BOOKS[b][0];if(BIB[slug])return BIB[slug];const r=await fetch("bible/"+slug+".json");if(!r.ok)throw new Error("HTTP "+r.status);return BIB[slug]=await r.json()}
function openBible(b,ch,hl){S.bible={b,ch,hl:hl||null};persist();bibleMode="reader";tab="bible";render();window.scrollTo(0,0)}
function renderBible(){
 const pos=bpos();
 if(bibleMode==="books"){
  const grp=(t,a,z)=>`<section class="stack" style="gap:10px"><h2>${t}</h2><div class="blist">${BOOKS.slice(a,z).map((bk,i)=>`<button class="bbook" data-bbook="${a+i}" aria-current="${a+i===pos.b}"><b>${bk[1]}</b><small>${bk[2]} chapter${bk[2]>1?"s":""}</small></button>`).join("")}</div></section>`;
  view.innerHTML=`<div class="stack" style="gap:22px;padding-top:10px"><button class="back" data-bmode="reader">${I.left}Back to reading</button><div><span class="eyebrow">World English Bible</span><h1>Choose a book</h1></div>${grp("Old Testament",0,39)}${grp("New Testament",39,66)}</div>`;return}
 if(bibleMode==="chapters"){
  const b=biblePickBook,bk=BOOKS[b];
  view.innerHTML=`<div class="stack" style="gap:18px;padding-top:10px"><button class="back" data-bmode="books">${I.left}All books</button><div><span class="eyebrow">Choose a chapter</span><h1>${bk[1]}</h1></div><div class="bchaps">${Array.from({length:bk[2]},(_,i)=>`<button data-bchap="${b}:${i+1}" aria-current="${b===pos.b&&i+1===pos.ch}">${i+1}</button>`).join("")}</div></div>`;return}
 const bk=BOOKS[pos.b],slug=bk[0];
 const head=`<div class="bhead"><div><span class="eyebrow">${S.bible?"Continue reading":"Start reading"}</span><h1>${bk[1]} ${pos.ch}</h1></div><button class="bpick" data-bmode="books">${I.down.replace('class="chev"','')}Books</button></div>`;
 if(!BIB[slug]){
  view.innerHTML=`<div class="stack" style="gap:18px;padding-top:10px">${head}<p class="muted">Loading ${bk[1]}…</p></div>`;
  loadBook(pos.b).then(()=>{if(tab==="bible")renderBible()}).catch(()=>{if(tab==="bible")view.querySelector("p.muted").textContent="This book couldn’t load. Check your internet connection and try again."});return}
 const vs=BIB[slug][pos.ch-1]||[],hl=S.bible&&S.bible.hl;
 const prev=pos.ch>1?[pos.b,pos.ch-1]:pos.b>0?[pos.b-1,BOOKS[pos.b-1][2]]:null;
 const next=pos.ch<bk[2]?[pos.b,pos.ch+1]:pos.b<65?[pos.b+1,1]:null;
 const lbl=x=>`${BOOKS[x[0]][1]} ${x[1]}`;
 view.innerHTML=`<div class="stack" style="gap:18px;padding-top:10px">${head}
 <article class="page"><div class="page-in btext">${vs.map((t,i)=>t?`<p class="bv${hl&&i+1>=hl[0]&&i+1<=hl[1]?" hl":""}" id="bv${i+1}"><sup>${i+1}</sup>${t}</p>`:"").join("")}</div></article>
 <div class="bnav">${prev?`<button class="btn ghost" data-bgo="${prev}">${I.left}${lbl(prev)}</button>`:"<span></span>"}${next?`<button class="btn" data-bgo="${next}">${lbl(next)}${I.right}</button>`:""}</div>
 <p class="foot">World English Bible (public domain).</p></div>`;
 if(hl){const el=document.getElementById("bv"+hl[0]);if(el)setTimeout(()=>el.scrollIntoView({block:"center"}),30)}
}
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.read){const r=parseRef(d.read);if(r){closeImage();openBible(r.b,r.ch,[r.from,r.to])}return}
 if(d.bmode){bibleMode=d.bmode;render();window.scrollTo(0,0);return}
 if(d.bbook){biblePickBook=+d.bbook;bibleMode="chapters";render();window.scrollTo(0,0);return}
 if(d.bchap){const [x,c]=d.bchap.split(":").map(Number);openBible(x,c,null);return}
 if(d.bgo){const [x,c]=d.bgo.split(",").map(Number);openBible(x,c,null);return}
 if(d.tab==="bible"&&b.classList.contains("tab"))bibleMode="reader";
},true);

render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const k in sceneCache)delete sceneCache[k];const y=window.scrollY;render();window.scrollTo(0,y)});
</script>
