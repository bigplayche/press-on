const PLANREAD = {"comeback": [["Injury is lonely in a way nobody warns you about. One day you’re in the middle of everything: practice, the group chat, the bus rides. The next you’re on a training table while your team runs drills you can only watch. People mean well, but after a week or two, most of them stop asking how you’re doing.", "David wrote, “Yahweh is near to those who have a broken heart, and saves those who have a crushed spirit.” Notice the direction. When you’re broken, God doesn’t keep his distance until you’re useful again. He moves closer.", "You may feel forgotten by the roster, but you’re not forgotten by God. He is nearer to you in the training room than he was when you were scoring."], ["Crutches, a brace, a walking boot, a trainer’s hand on your shoulder as you test your weight. Recovery teaches you how much you need to be held up. God says, “I will uphold you with the right hand of my righteousness.” Even on the days you can’t stand on your own, you’re being held."], ["Romans 8:28 gets quoted a lot after injuries, sometimes too quickly. “All things work together for good” can sound like someone telling you your torn ACL is secretly great news. That’s not what Paul is saying.", "He doesn’t say everything that happens is good. Injuries hurt. Missed seasons hurt. Paul himself was beaten, shipwrecked and imprisoned. What he says is that God works all things together for good for those who love him. God takes the painful pieces and weaves them into something you can’t see yet.", "Many athletes look back on an injury as the season they learned patience, found their faith or discovered what they really cared about. You don’t have to feel that way yet. You only have to trust that God hasn’t stopped working, even now."], ["Rehab progress is slow, and it isn’t a straight line. One week you hit a new range of motion. The next week the swelling comes back and you feel like you’ve lost everything. It’s easy to get discouraged.", "The writer of Lamentations sat in the ruins of his city and still wrote, “His compassion doesn’t fail. They are new every morning.” Every morning in recovery is a fresh start. Yesterday’s setback doesn’t cancel today’s mercy. Celebrate the small wins, and start again tomorrow."]], "gameday": [["Moses was old and about to die. The people of Israel were about to face nations bigger and stronger than they were, without him. So he told them, “Be strong and courageous. Don’t be afraid or scared of them; for Yahweh your God himself is who goes with you.”", "Their courage wasn’t supposed to come from their size or their training. It came from who went with them. The same is true before your biggest games. You still prepare. But you walk into the arena with God, not alone."], ["Warmups are loud. Music blasting, crowd filing in, coaches yelling, your own heart pounding in your ears. Before all of it, find ten seconds to be still. “Be still, and know that I am God.” Nerves are normal, and they don’t mean you aren’t ready. Stillness simply reminds you that God is God, and you don’t have to be."], ["Habakkuk wrote his short book during one of the worst times in Israel’s history. Invasion was coming. Crops might fail. Nothing looked stable. And he ended with this: “Yahweh, the Lord, is my strength. He makes my feet like deer’s feet, and enables me to go in high places.”", "Mountain deer can stand on narrow ledges where one wrong step would be a disaster. Their feet are made for it. Habakkuk is saying that God gives steady footing in the most precarious places.", "Big games feel like high, narrow places. One mistake feels like it could cost everything. Ask God for steady feet: a calm mind, a settled heart and focus on the next play instead of the edge of the cliff."], ["Philippians 4:13 is written on more eye black, wristbands and locker room walls than almost any other verse. “I can do all things through Christ, who strengthens me.” Most people read it as a promise that Jesus will help you win.", "But read the verses right before it. Paul says he has learned to be content whether he’s well fed or hungry, whether he has plenty or nothing. The “all things” he can do through Christ is be at peace in any situation.", "That makes it a perfect game-day verse, just not in the way it’s usually used. Christ gives you strength to compete hard and stay steady whether you win by thirty or lose on the last play. That’s a strength no opponent can take from you."]], "grace": [["Some athletes spend a lot of energy promoting themselves: the highlight edits, the reminders of their stats, the subtle comments about how underrated they are. It’s tiring to keep proving yourself.", "Peter writes, “Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time.” Humility isn’t thinking you’re bad. It’s trusting God with your rise, so you don’t have to force it."], ["Every athlete has seen it: the team that celebrates before the clock hits zero, the runner who eases up at the line and gets passed. “Pride goes before destruction, and an arrogant spirit before a fall.” Pride makes you careless and stops you from listening. Humility keeps you learning, keeps you respecting every opponent and keeps you sharp until the very end."], ["When God sent the prophet Samuel to anoint Israel’s next king, Samuel went to Jesse’s house and saw his oldest son, Eliab. He was tall and impressive, the kind of player who looks like a starter getting off the bus. Samuel thought, “This has to be the one.”", "God said no. “For man looks at the outward appearance, but Yahweh looks at the heart.” Jesse paraded seven sons past Samuel, and God rejected every one. The one God chose wasn’t even invited. David, the youngest, was out in the fields watching sheep.", "Scouts look at size, speed and measurables. God looks at the heart. Success doesn’t make you more valuable to him, and being overlooked doesn’t make you less. Keep your heart in a place God would be glad to see."], ["Paul says that whatever you do, even something as ordinary as eating and drinking, can be done for God’s glory. That includes your sport. When you play with gratitude, compete with integrity, celebrate with humility and lose with grace, the game itself becomes worship. You don’t have to choose between competing hard and honoring God. You can do both in the same play."]], "grind": [["Paul doesn’t trash athletic training. He says plainly that “bodily exercise has some value.” He knew athletes. He used them as examples all the time. Discipline, sacrifice and pushing past limits are good things.", "Then he adds that godliness “has value in all things, having the promise of the life which is now, and of that which is to come.” Your body will only compete for so many years. What you build in your soul lasts forever. Train both."], ["Picture a sprinter lining up in a heavy winter coat and boots. It’s ridiculous. Nobody races carrying extra weight on purpose.", "Hebrews says to “lay aside every weight and the sin which so easily entangles us, and let us run with perseverance the race that is set before us.” Some things that slow you down aren’t even sinful. They’re just heavy: too much time on your phone, friendships that pull you the wrong way, grudges you keep carrying, the need to impress everyone.", "Before the writer tells you to run with endurance, he tells you to drop the weight. Sometimes the best thing you can do for your race is take something off rather than add something on. What would you be able to do if you weren’t carrying it?"], ["“Count it all joy” when you face trials, James says, because the testing of your faith produces endurance. It works like interval training for the soul. Nobody enjoys the last sprint, the one where your lungs burn and your legs shake. But everyone wants what it builds. Hard seasons in life are doing the same quiet work in you."], ["Proverbs says the righteous falls seven times and rises up again. It doesn’t say the righteous never fall. Falling is guaranteed in sports and in life. What separates people is whether they get back up.", "Make getting back up a habit. After a bad rep, reset. After a bad game, show up to practice. After a bad choice, go back to God. Seven times, seventy times, as many as it takes."]], "rest": [["Jesus said, “Come to me, all you who labor and are heavily burdened, and I will give you rest.” He didn’t say “come once you’ve got your energy back” or “come once you’ve fixed your attitude.” He invited the tired and the overloaded exactly as they are.", "Burnout has a way of making you feel like you need to get better before you come to God. You don’t. Bring him the exhaustion, the lost motivation and the frustration you feel about all of it."], ["When Elijah was so burned out he asked God to take his life, God’s first move was not a sermon. “He lay down and slept under a juniper tree; and behold, an angel touched him, and said to him, ’Arise and eat!’” He ate, slept again and ate again. Only after that did God speak to him about what was next.", "Sometimes the most spiritual step you can take is physical. Real sleep. Real meals. A real break from screens and noise. Your body and your soul are connected, and God cares about both."], ["Sheep don’t lie down when they’re anxious, hungry or afraid. A shepherd has to create the conditions for rest: safe ground, enough food and still water nearby.", "David wrote, “He makes me lie down in green pastures. He leads me beside still waters. He restores my soul.” Notice who does the work. The Shepherd makes, leads and restores. Your job is to follow him to the places where rest is possible.", "That might mean saying no to an extra session, putting your phone away an hour before bed or spending a quiet morning with God instead of scrolling highlights. Ask him to lead you to green pastures this week, and then actually go."], ["Isaiah promises that those who wait for the Lord will mount up with wings like eagles, run and not be weary, walk and not faint. Some days you’ll soar. Some days you’ll run. Some days you’ll just keep walking, one tired step at a time. All three count as renewed strength. On a walking day, don’t feel like you’re failing. You’re still moving forward with God."], ["Think back to when you first fell in love with your sport. Maybe it was shooting in the driveway until dark or racing your friends at recess. There was no pressure, no recruiting and no stats. Just joy.", "Nehemiah told a weeping crowd, “The joy of Yahweh is your strength.” Burnout steals joy, but God can give it back. Ask him to restore the kid in you who loved to play, and protect that joy fiercely."]], "unity": [["Talent doesn’t guarantee chemistry. Every coach has had a roster that looked great on paper and never clicked, and a group of overlooked players who played for each other and overachieved.", "David wrote, “See how good and how pleasant it is for brothers to live together in unity!” He compares unity to fragrant oil poured on a priest’s head and running down his beard, and to dew falling on the mountains. It’s rich, it spreads and it brings life.", "Unity like that isn’t automatic. It’s built through choices: who you sit with, how you talk about teammates when they’re not around and whether you celebrate their wins. Pay attention this week to the choices that build your team or quietly divide it."], ["“As much as it is up to you, be at peace with all men.” Paul admits you can’t control everyone. Some people won’t make peace no matter what you do. But you are responsible for your part: your words, your tone, your apologies and your willingness to make the first move. Do everything you can, and leave the rest to God."], ["Grudges on a team are like playing through an injury nobody knows about. You can keep going, but it slows you down and gets worse over time.", "Paul writes, “Be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you.” The standard is how God forgave you: completely, at great cost, before you even asked.", "Forgiving doesn’t mean pretending the hurt wasn’t real or letting someone keep hurting you. It means you stop keeping score and release your right to get even. It frees your teammate, and it frees you even more."], ["Every teammate carries something you can’t see: a parent’s illness, money stress at home, a breakup or a fear they haven’t told anyone. Paul says, “Bear one another’s burdens, and so fulfill the law of Christ.” Carrying a burden doesn’t mean fixing it. Sometimes it means noticing, asking how someone is really doing and showing up so they don’t carry it alone."], ["At the end of a long list of virtues, like compassion, kindness, humility and patience, Paul writes, “Above all these things, walk in love, which is the bond of perfection.” Love is what holds everything together.", "Skill wins games. Love holds teams together when they’re losing, when someone is struggling or when the pressure gets intense. Teams that love each other don’t fall apart when things go wrong. Be the teammate who keeps the bond strong."]], "losing": [["Losing seasons make the voice in your head loud. “We’re terrible. I’m wasting my time. Nothing is ever going to change.” By the middle of the season, those thoughts can feel like facts.", "The writer of Psalm 42 was in a dark place too. He felt far from God, and people were mocking him. But instead of just listening to his discouragement, he argued with it: “Why are you in despair, my soul? Why are you disturbed within me? Hope in God! For I shall still praise him.”", "He repeats that line three times across two psalms. Hope didn’t come easily. He had to keep telling himself the truth. You can do the same. Coach your own soul like you’d coach a struggling teammate, and point it back to God."], ["Micah doesn’t pretend. He admits the fall and admits the darkness. But he also says, “When I fall, I will arise. When I sit in darkness, Yahweh will be a light to me.” A loss is real, and it’s okay to feel it. It just doesn’t get the final word. The next practice is a chance to rise."], ["Habakkuk pictured the worst possible season for a farmer. No figs on the tree. No grapes on the vine. The olive crop fails. The fields produce nothing. No sheep in the pen, no cattle in the stalls. Every measure of success, gone.", "Then he wrote, “Yet I will rejoice in Yahweh. I will be joyful in the God of my salvation.”", "That “yet” is one of the most powerful words in the Bible. It means his joy didn’t depend on results. In a losing season, joy that comes from winning disappears quickly. Joy rooted in God survives zero wins. Ask him for that kind of joy, the kind that doesn’t need a scoreboard to stay alive."], ["Paul says suffering produces perseverance, perseverance produces character and character produces hope. It works like a training block. You can’t skip straight to the result.", "Losing seasons build things winning seasons can’t: grit, humility, leadership and an appreciation for every win that comes later. Many great careers were forged in hard years. This one may be building something in you that will matter long after the record is forgotten."], ["Paul called his troubles “light affliction, which is for the moment.” This from a man who had been beaten, shipwrecked and imprisoned. He wasn’t minimizing pain. He was comparing it to an eternal weight of glory.", "Your record matters this year. It won’t matter in eternity. That perspective doesn’t mean you stop caring. It means you can keep your effort high without letting a losing season crush your soul. Play hard to the final whistle, and keep your eyes on what lasts."]], "future": [["The recruiting process can take over your life. Which camps to attend, which coaches to email, which highlight film to send and which offers to wait for. It’s easy to feel like everything depends on getting each step exactly right.", "Proverbs says, “A man’s heart plans his course, but Yahweh directs his steps.” Make your plan. Send the emails. Show up to the camps and play your best. Planning is wise, and God isn’t against it.", "But hold your plan with an open hand. The coach who goes quiet, the offer that comes from a school you’d never considered and the door that closes suddenly are all part of a path God is directing. Do your part, and let him lead."], ["God spoke Jeremiah 29:11 to people stuck in exile for seventy years, far from home and unsure of everything. “For I know the thoughts that I think toward you... thoughts of peace, and not of evil, to give you hope and a future.” You don’t need to see the whole map to trust the One who drew it."], ["Big decisions don’t come with an answer key. Should you commit early or wait? Stay close to home or go far away? Play at a bigger school with less playing time or a smaller one where you’d start? Should you keep playing at all?", "James writes, “If any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach; and it will be given to him.” God doesn’t roll his eyes when you ask for help. He gives generously.", "Wisdom usually comes through several channels: time in scripture, honest prayer, the advice of people who know you well and a sense of peace or unrest that grows over time. Ask God, then pay attention. He will make the path clearer."], ["You won’t understand every part of this process. Offers that never come, a coach who stops answering or a school that surprises you. “Trust in Yahweh with all your heart, and don’t lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight.” Trust doesn’t require full understanding."], ["Jesus said, “Seek first God’s Kingdom and his righteousness; and all these things will be given to you as well.” He was talking to people anxious about food and clothes. Your anxiety might be about scholarships, rosters and your future.", "Wherever you end up, put God first there. The campus, the conference and the jersey matter less than the person you become. Ask yourself what kind of teammate, student and follower of Jesus you want to be in four years, and start becoming that person now."]], "scroll": [["Paul writes, “But let each man examine his own work, and then he will have reason to boast in himself, and not in someone else.” Every scroll shows you someone faster, stronger, more recruited or more famous. Comparison will steal your joy faster than any loss. God hasn’t asked you to run their race. Run yours."], ["“Fret” means to burn yourself up with worry, envy or anger. Scrolling through other athletes’ highlights, offers and celebrations can do exactly that. You start the scroll feeling fine and end it feeling behind.", "David wrote, “Rest in Yahweh, and wait patiently for him. Don’t fret because of him who prospers in his way.” David spent years watching Saul hold the throne God had promised him. He knew what it was like to watch someone else get what you wanted.", "His answer was rest and patience. Trust that God’s timing for your story is good. Close the app, take a breath and remember that your worth isn’t measured by what other people post."], ["Paul asked, “For am I now seeking the favor of men, or of God?” Social media turns every athlete into someone performing for an audience. Likes rise and fall with your last game. God’s approval doesn’t.", "Before you post, ask yourself who it’s for. There’s nothing wrong with sharing a good moment. But if your peace depends on the reaction, you’re playing for the wrong audience."], ["“Let another man praise you, and not your own mouth.” You don’t have to post every stat, every award and every offer. Let your work speak for itself. Humility online is rare, and that’s exactly why it stands out. People notice the athlete who celebrates teammates more than themselves, and so does God."], ["You become what you think about, and you think about what you scroll. Every hour of content shapes your mind a little: what you believe about your body, your worth, success and other people.", "Paul gives a filter: “Whatever things are true, whatever things are honorable, whatever things are just, whatever things are pure, whatever things are lovely, whatever things are of good report... think about these things.”", "Run your feed through that filter. Unfollow accounts that make you feel worthless, jealous or tempted. Follow people who point you toward what’s good. Curate what goes into your mind the way you’d plan what goes into your body before a big game."]], "captain": [["Jesus’ disciples once argued about which of them was the greatest. James and John even asked for the best seats in his kingdom. Everyone wanted to be the star.", "Jesus told them that in his kingdom, greatness looks different. “For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many.” The most powerful leader in history washed feet and carried a cross.", "Captains in God’s kingdom carry equipment, check on the end of the bench, welcome freshmen and do the unglamorous jobs first. Leadership isn’t a title that gets you served. It’s a role that has you serving."], ["Paul told young Timothy not to let anyone look down on him for being young, but to be an example in speech, conduct, love, faith and purity. People follow what you do more than what you say. Your example in practice is louder than any speech in the locker room."], ["When God offered Solomon anything he wanted, the new king asked for an understanding heart to lead people well. God was so pleased that he gave him wisdom and more. Leadership is full of hard calls, like confronting a teammate or handling conflict. Ask God for wisdom before anything else."], ["Captains set the emotional temperature of a team. When the captain panics, the team panics. When the captain loses their temper at a ref, the bench follows.", "Proverbs says, “A gentle answer turns away wrath, but a harsh word stirs up anger.” In tense moments, a calm captain can settle a whole team. That doesn’t mean being soft. It means being steady.", "Practice staying calm when it’s hard: when a call goes against you, when a teammate snaps or when the game is slipping away. Your composure will become your team’s composure."], ["God told Joshua three times in one chapter to be strong and courageous as he took over leadership from Moses. Joshua was following a legend, and he needed to hear it more than once.", "Leading is scary sometimes. You’ll have to say hard things, make unpopular calls and carry pressure your teammates don’t see. But God’s promise to Joshua is yours too: “Yahweh your God is with you wherever you go.” You don’t lead alone."]], "jersey": [["There’s a season to play and a season to stop. “For everything there is a season, and a time for every purpose under heaven.”", "Every career ends, whether it’s after high school, after college or after a professional run. That isn’t a tragedy. It’s the shape of life. God is the God of every season, including the one that comes after the final whistle."], ["At the end of his life, Paul looked back and wrote, “I have fought the good fight. I have finished the course. I have kept the faith.” He didn’t say he won every race or that everyone liked him. He said he finished and stayed faithful.", "Think about the end of your career now, before it arrives. What do you want to be able to say about how you played, how you treated people and who you became? That’s the scoreboard that will matter most when the jersey comes off.", "Seniors especially, run your last season so you can say what Paul said. Finish with no regrets about your effort, your attitude or your faith."], ["God told his people, “Don’t remember the former things, and don’t consider the things of old. Behold, I will do a new thing.” The end of your sport is the start of something else: new purpose, new relationships and new ways to use what you’ve learned. Look for the new thing God is doing."], ["“He doesn’t delight in the strength of the horse. He takes no pleasure in the legs of a man. Yahweh takes pleasure in those who fear him, in those who hope in his loving kindness.”", "For years, your legs, speed and strength have been central to who you are. People praised them. Coaches recruited them. It’s natural to wonder what’s left when those fade.", "This psalm answers that question. God never loved you for your legs. He delights in people who trust him and hope in his love. That doesn’t retire. When your athletic identity fades, his delight in you stays exactly the same."], ["Paul writes that you were created for good works that God prepared in advance. Many of those works have nothing to do with sports.", "The discipline you built, the teamwork you learned, the way you handled pressure and the perseverance you developed will serve you in jobs, families, friendships and churches for the rest of your life. Your sport was training for more than your sport."]], "identity": [["Before you were a point guard, a sprinter or a goalkeeper, you were a person made in the image of God. “God created man in his own image. In God’s image he created him; male and female he created them.”", "That gives you a worth no performance can add to and no failure can take away. A great game doesn’t make you more valuable to God. A terrible one doesn’t make you less. You bear his image either way."], ["Sports make you hyper-aware of your body. Too short, too slow, too thin, too big. You notice every flaw because the stat sheet and the scouts notice them too.", "David wrote, “I will give thanks to you, for I am fearfully and wonderfully made.” He goes on to describe God forming him in the womb, knowing him before he was born and writing his days in a book.", "Training to get better is good. Hating the body God gave you is not. Thank him for how he made you, including the parts you’d change if you could. You were designed with care."], ["John writes, “Behold, how great a love the Father has given to us, that we should be called children of God!” Not a recruit. Not a ranking. Not a number on a roster. A son or daughter of God.", "A bad game can’t change your family. When you walk off the court after your worst performance, you’re still a child of God. Let that settle you before you compete and after you’re done."], ["“It is no longer I that live, but Christ lives in me. That life which I now live in the flesh, I live by faith in the Son of God, who loved me, and gave himself up for me.” Your identity is rooted in being loved by Jesus, not in being impressive. That’s a foundation no slump can crack."], ["Paul lists everything he can think of that might come between us and God: death, life, angels, rulers, things present, things to come, powers, height and depth. Then he says that none of it, nor anything else in all creation, can separate us from God’s love in Christ.", "Put your own fears in that list. Not a loss. Not an injury. Not getting cut. Not the end of your career. Not your worst mistake.", "Everything else about your athletic identity can be taken away: your position, your ranking, your health and your scholarship. God’s love can’t. That makes it the most secure identity you could ever have. Build on it."]], "mistakes": [["Coaches have a phrase for after a mistake: next play. You can’t undo the fumble, the turnover or the missed assignment. Dwelling on it only makes the next play worse.", "Paul had more reasons than most to live in regret. Before following Jesus, he had hunted down and imprisoned Christians. Yet he wrote, “Forgetting the things which are behind, and stretching forward to the things which are before, I press on toward the goal.”", "Forgetting doesn’t mean pretending it never happened. It means refusing to let the past call the next play. Learn what you need to learn, then let it go and press on."], ["“As far as the east is from the west, so far has he removed our transgressions from us.” North and south meet at the poles. East and west never meet. That’s how far God removes your sin when you confess it. Forgiven means gone. Stop picking back up what God has already taken away."], ["Lamentations was written in the rubble of a destroyed city, after the people’s own failures had led to disaster. Still the writer said, “His compassion doesn’t fail. They are new every morning. Great is your faithfulness.”", "Yesterday’s mistake doesn’t carry over into today’s mercy. Every morning comes with a fresh supply. Treat today as a new start, because God does."], ["Peter swore he would never leave Jesus. A few hours later, standing by a fire in a courtyard, he denied knowing him three times. When the rooster crowed, he went out and wept bitterly.", "After the resurrection, Jesus found Peter by another fire on a beach. He cooked him breakfast. Then he asked him three times, “Do you love me?” Three denials, three chances to say yes. Each time Jesus responded with a job: “Feed my sheep.”", "Jesus didn’t just forgive Peter. He restored him and gave him a role. Peter went on to lead the early church. Your worst failure isn’t the end of your story with Jesus either. He still has work for you."], ["“There is therefore now no condemnation to those who are in Christ Jesus.” Conviction from God points to something specific and leads you to make it right. Condemnation attacks your whole identity and keeps you stuck in shame. Only one of those voices comes from God. Listen to him, not the other one."]], "coach": [["“Whoever loves correction loves knowledge, but he who hates reproof is stupid.” Blunt, but true. Think about the athletes on your team who improve the most. They’re usually not the most talented. They’re the most coachable. They hear correction as information, not as an attack, and they apply it right away. Be that athlete this week."], ["Conditioning is miserable. Film sessions sting. Practices where the coach stops every drill to correct you feel endless. In the moment, discipline never feels good.", "Hebrews admits it: “All chastening seems for the present to be not joyous but grievous; yet afterward it yields the peaceful fruit of righteousness to those who have been trained by it.” The key word is “afterward.” The fruit doesn’t come during the hard part. It comes later, to those who stay in it.", "Trust the process. The coach who pushes you is often the one who believes in you most. And God’s discipline in your life is proof that he’s invested in who you’re becoming."], ["Coaches, trainers, older teammates and mentors see things in you that you can’t see in yourself: a habit in your form, a blind spot in your attitude or a strength you’ve overlooked. “Where there is no counsel, plans fail; but in a multitude of counselors they are established.” Ask for feedback before you need it, and listen carefully when it comes."], ["Not every coach is fair. Some play favorites, yell too much or overlook players who work hard. It’s tempting to check out and only give effort when you’re being rewarded.", "Paul wrote to people in far worse situations, including servants under harsh masters: “And whatever you do, work heartily, as for the Lord, and not for men.” Your effort is ultimately offered to God, not just to the person with the whistle.", "That doesn’t mean you can never respectfully talk to a coach about a problem, or that you should stay quiet if a coach is abusive. Tell a parent or trusted adult if something is wrong. But in ordinary frustration, play for God. He sees every rep."], ["“Let every man be swift to hear, slow to speak, and slow to anger.” Coachable athletes listen first and react later. Next time your coach corrects you, hold your response for a few seconds. Hear the whole thing, including the part you don’t like. Then answer calmly. You’ll learn more, and you’ll earn more trust."]], "words": [["Locker rooms can get loud with trash talk, cutting jokes and complaints about coaches. Words fly fast, and some of them leave marks that last longer than any bruise.", "Paul writes, “Let no corrupt speech proceed out of your mouth, but only what is good for building others up as the need may be, that it may give grace to those who hear.” The word for “corrupt” is the same word used for rotten fruit. Rotten words spoil a team.", "Every word you say is either building something or tearing something down. Pay attention to which one your words are doing."], ["James writes, “So the tongue is also a little member, and boasts great things. See how a small fire can spread to a large forest!”", "One careless comment can spread through a team in hours: a joke at someone’s expense, a piece of gossip, a complaint about the coach repeated in the group chat. Small sparks start big fires.", "If your words have caused damage lately, make it right. Apologize directly. Then be careful with your words going forward. Protecting your team’s culture starts with your own mouth."], ["“Anxiety in a man’s heart weighs it down, but a kind word makes it glad.” You never know what a teammate is carrying behind the jokes. A single encouraging sentence, said at the right moment, might be the thing that turns their whole day around. Look for the teammate who seems down today, and give them a specific, honest good word."], ["David prayed, “Let the words of my mouth and the meditation of my heart be acceptable in your sight, Yahweh, my rock, and my redeemer.” He cared about what he said out loud and what he said to himself inside his head.", "What you say to yourself after a mistake matters. “I’m terrible. I always mess up. I’m not good enough.” You’d never let a teammate talk to another teammate that way. Don’t talk to yourself that way either. Speak to yourself the way God speaks to you."], ["“Do all things without complaining and arguing.” Complaining spreads fast on a team. One person grumbles about the drill, then three more join in, and suddenly practice feels miserable for everyone. Paul says people who live without grumbling shine like stars. Be the one who doesn’t complain, and watch your team’s mood start to change."]], "thankful": [["After a championship, everybody is grateful. A month later the banner is hung, the rings are in a drawer and everyone is focused on next season. Gratitude fades fast.", "David told his own soul, “Praise Yahweh, my soul, and don’t forget all his benefits.” Then he listed them: forgiveness, healing, rescue, love, mercy and good things that satisfy. Gratitude doesn’t happen by accident. It takes intentional remembering. Look back on purpose this week."], ["“Rejoice always. Pray without ceasing. In everything give thanks, for this is the will of God in Christ Jesus toward you.”", "Notice Paul says “in everything,” not “for everything.” You don’t have to thank God for your injury or your loss as if they were good. But you can find reasons to give thanks in the middle of them: teammates who showed up, a body that’s healing and a God who hasn’t left.", "People often ask what God’s will is for their lives. Paul answers part of it plainly. Rejoice, pray and give thanks, starting today, whatever kind of day it is."], ["Moses warned Israel that when they prospered, they might say, “My power and the might of my hand has gotten me this wealth.” Instead, he told them to remember that God is the one who gives the power to succeed. Your speed, strength, coordination and health all came from somewhere. Your hard work is real, but so is the Giver behind it. Thank him by name for the gifts you compete with."], ["Paul wrote, “I have learned in whatever state I am, to be content in it. I know how to be humbled, and I know also how to abound.” He learned contentment. It didn’t come naturally.", "Gratitude and contentment are teammates. Discontent always looks at what’s missing: the minutes you’re not getting, the offer that didn’t come, the gear someone else has. Gratitude looks at what’s already there.", "You can keep goals and still be content. Practice it like a skill. Every time you notice yourself wanting more, name one thing you already have and thank God for it."], ["“Give thanks to Yahweh, for he is good, for his loving kindness endures forever.” Psalm 107 tells story after story of people who were lost, trapped, sick or caught in storms. Every time they cried out, God’s love came through. His love has an undefeated record. End this plan by naming where you’ve seen it in your own life this week."]], "offseason": [["The season just ended. Your body is beat up, your schedule finally has open space and part of you feels like you should already be training for next year.", "After his disciples came back from a long stretch of ministry, Jesus told them, “Come away into a deserted place, and rest awhile.” So many people were coming and going that they didn’t even have time to eat. Jesus saw it, and he scheduled rest.", "Start your off-season the way Jesus would: by actually resting. Let your body heal. Let your mind reset. Spend unhurried time with God. You’ll build better later if you rest well now."], ["The off-season isn’t wasted time. It has a different purpose than the playoffs. “For everything there is a season, and a time for every purpose under heaven.” This season is for recovering, reflecting and rebuilding, in your body and in your faith. Embrace what this season is for instead of wishing it were something else."], ["Good athletes watch film after the season. They look honestly at what worked and what didn’t, not to beat themselves up but to get better.", "The writer of Lamentations said, “Let us search and try our ways, and turn again to Yahweh.” Do the same review with your heart. How did you handle pressure? How did you treat teammates? Where did you trust God, and where did you try to carry everything yourself?", "Write down what you learned. Then take it to God and ask him to help you grow. The off-season is the best time to change, because nobody is keeping score."], ["Trees grow their deepest roots in the quiet seasons, long before anyone sees fruit. Psalm 1 describes a person who delights in God’s word as “a tree planted by the streams of water, that produces its fruit in its season.”", "Build your spiritual habits now, while your schedule is lighter. Daily scripture, regular prayer and time with other believers will hold you up when next season gets busy."], ["“Go to the ant, you sluggard. Consider her ways, and be wise.” The ant has no coach, no crowd and no scoreboard, and it works anyway.", "Off-season workouts are where athletes separate themselves, precisely because nobody is cheering. There’s no game on Friday to motivate you. You have to decide to show up.", "Make a plan and stick to it. And remember who you’re really working for. Offer the quiet workouts to God. He sees every one of them."], ["Luke sums up Jesus’ teenage years in one sentence: “Jesus increased in wisdom and stature, and in favor with God and men.” He grew in his mind, his body, his relationship with God and his relationships with people.", "Use the off-season to grow in more than your sport. Read a good book. Get closer to your family. Invest in friendships you neglected during the season. Serve at church or in your community. A well-rounded person makes a better teammate."], ["“He who began a good work in you will complete it until the day of Jesus Christ.” As next season approaches, trust that God is still working on you, in your game and in your heart. You may not feel finished, and you aren’t. But he finishes what he starts. Step into the new season with confidence in him."]], "camp": [["Every great season starts long before the first game, with a foundation nobody sees. Jesus told a story about two builders. Both houses faced the same rain, floods and wind. One stood and one collapsed. The difference was the foundation.", "Jesus said the wise builder is the one who “hears these words of mine, and does them.” Not just hears them. Does them. Over the next three weeks, you’ll build your faith the same way you build fitness: one day at a time, by actually doing the work."], ["You can’t run plays you don’t know. God’s word is your playbook. “Your word is a lamp to my feet, and a light for my path.” Commit to reading some scripture every day for the next three weeks, even if it’s just a few verses. Consistency matters more than volume."], ["After a day of healing crowds, Jesus “rose up early, while it was still dark, and went out, and departed into a deserted place, and prayed there.” Before the demands started, he spent time with his Father.", "Find your quiet time and protect it like a workout. It might be before school, after practice or right before bed. What matters is that it happens every day."], ["You were fearfully and wonderfully made. Your body is a gift from God, and taking care of it is part of honoring him.", "That means more than training hard. It means sleep, real food, hydration and recovery. Many athletes push their bodies relentlessly in workouts and then neglect them everywhere else.", "This week, pay attention to the basics. Get enough sleep. Eat like someone who wants to perform. Treat your body like something God made with care, because he did."], ["“One who walks with wise men grows wise, but a companion of fools suffers harm.” Your training partners shape your fitness, and your friends shape your faith. Who are you spending most of your time with? Choose people who push you toward God and toward good, and be that kind of friend to them in return."], ["Philippians 4:13 is famous, but the verses right before it give its real meaning. Paul learned to be content in plenty and in want, and he said he could do all things through Christ who strengthens him.", "Real strength isn’t winning every game. It’s peace in every outcome. As you finish week one, ask Christ for that kind of strength: the strength to compete hard and stay steady no matter what the scoreboard says."], ["Even God rested on the seventh day. Take today off from striving. No extra workouts and no grinding. Let your muscles recover, sleep in if you can and spend a little extra time just being with God. Thank him for the first week of camp and for the strength he gave you to get through it."], ["Week two is about endurance. Hebrews says, “Lay aside every weight and the sin which so easily entangles us, and let us run with perseverance the race that is set before us.”", "No runner races in a heavy coat. Some of what slows you down is sin. Some is just weight: distractions, unhealthy relationships, grudges and the need to impress people.", "Before you can run with endurance, you have to drop what’s holding you back. Name one weight today and set it down."], ["Conditioning hurts, but it builds what you’ll need in the fourth quarter. Paul says suffering produces perseverance, perseverance produces proven character and character produces hope. Hard seasons in life work the same way as hard workouts. They build something you can’t get any other way. Don’t waste the burn."], ["The middle of camp is where people quit. The excitement of day one is gone, and the finish line still feels far away. Your legs are heavy and your motivation is low.", "Paul wrote, “Let’s not be weary in doing good, for we will reap in due season, if we don’t give up.” Notice the condition: if we don’t give up. The harvest is real, but it comes to people who keep going.", "Whatever you’re tempted to quit, in your training or your faith, stay with it a little longer. Day ten is exactly where the work starts to pay off."], ["“He gives power to the weak. He increases the strength of him who has no might.” By day eleven, the tank runs low. When you’re out of gas, ask God for strength you can’t produce yourself. An empty tank isn’t a dead end. It’s an invitation to rely on him."], ["James says, “Blessed is a person who endures temptation, for when he has been approved, he will receive the crown of life.” Testing shows what’s really inside you.", "In the ancient games, winners received wreaths of leaves that wilted in days. The crown James describes never fades. Whatever test you’re facing today, endure it faithfully. The reward is worth it."], ["Paul described his life like this: “pressed on every side, yet not crushed; perplexed, yet not to despair; pursued, yet not forsaken; struck down, yet not destroyed.”", "Those are boxing words. Knocked down, but not knocked out. By day thirteen, you might feel pressed and worn down. That’s normal. God’s power keeps you standing even when you feel like you’re on the ropes."], ["Jesus told his exhausted disciples to come away to a quiet place and rest. Recover today in body and soul. Stretch, sleep, eat well and spend unhurried time with God. Rest is part of the training, not a break from it. You’ve finished two weeks. Let your body and your faith absorb the work."], ["Week three is about getting game ready. God told Joshua, “Be strong and courageous. Don’t be afraid. Don’t be dismayed, for Yahweh your God is with you wherever you go.”", "Wherever includes your next game, your next tryout and your next big moment. Joshua faced walled cities and armies. Your challenges are different, but the promise is the same. You don’t step onto the field alone."], ["Before the noise of warmups, take a moment to be still. “Be still, and know that I am God.” Build a few seconds of stillness into your pregame routine: one deep breath, one short prayer and a reminder of who God is. The game will still be loud. You’ll walk into it steady."], ["“Whatever you do, work heartily, as for the Lord, and not for men.” Playing for an audience of one frees you. You don’t need the crowd’s approval or the coach’s praise to give your best. The scouts may or may not be watching. God always is, and you’re already playing for the One who loves you most."], ["Paul knew athletes. He wrote, “Don’t you know that those who run in a race all run, but one receives the prize? Run like that, that you may win.”", "Faith isn’t passive. Paul compares following Jesus to competing with everything you have: discipline, focus and full effort.", "Bring that intensity to your sport and to your faith this week. Don’t jog through either one."], ["“Iron sharpens iron; so a man sharpens his friend’s countenance.” Sharpening takes friction: harder drills, honest feedback and teammates who won’t let you coast. Push your teammates toward their best, and let them push you. Great teams don’t make each other better by accident. They do it on purpose."], ["“Whether therefore you eat, or drink, or whatever you do, do all to the glory of God.” Win or lose this season, let it point to him. That changes how you celebrate, how you handle losses and how you treat everyone along the way, from the star to the equipment manager. Your whole season can become worship."], ["You made it. Twenty-one days of building your faith like you build your fitness.", "At the end of his life, Paul wrote, “I have fought the good fight. I have finished the course. I have kept the faith.” He finished well.", "Now take what you’ve built into your season. Keep reading the playbook, keep your quiet time, keep resting well and keep playing for an audience of one. Training camp is over. The season is just beginning."]]};
const PLANS = [
{id:"comeback",related:["rest","losing"],title:"The Comeback",sub:"For injured athletes",scene:"summit",about:"Four days for the season you didn’t plan on: surgery, rehab, sitting out. God is closer than the sideline feels.",days:[
 {ref:"Psalm 34:18",title:"God Is Close",read:"Injury can feel lonely. You’re out of the huddle and out of the routine. This verse says God moves toward the brokenhearted, not away from them.",q:"Where do you feel most alone right now?"},
 {ref:"Isaiah 41:10",title:"Held Up",read:"Crutches, braces, a trainer’s hand on your shoulder. God says he will uphold you with his right hand. You are being held even when you can’t stand on your own.",q:"What are you most afraid of in your recovery?"},
 {ref:"Romans 8:28",title:"Nothing Wasted",read:"This verse doesn’t say everything is good. It says God works all things together for good. He can use even this setback in your story.",q:"What good could grow out of this season?"},
 {ref:"Lamentations 3:22-23",title:"New Every Morning",read:"Rehab progress is slow, and some days you go backward. God’s mercies are new every morning, so each day is a fresh start.",q:"What small win can you celebrate today?"}]},
{id:"gameday",related:["mistakes","captain"],title:"Game Day",sub:"For pressure and nerves",scene:"lights",about:"Four short readings to take into the locker room before the biggest moments of your season.",days:[
 {ref:"Deuteronomy 31:6",title:"He Goes With You",read:"Moses spoke this to people facing an opponent bigger than they were. Their courage came from knowing God went with them.",q:"What opponent or situation feels bigger than you?"},
 {ref:"Psalm 46:10",title:"Be Still",read:"Before the noise of warmups, take a moment to be still. Nerves are normal. Stillness reminds you that God is God, and you don’t have to be.",q:"Where can you build a moment of stillness into your game-day routine?"},
 {ref:"Habakkuk 3:19",title:"Sure Footing",read:"Habakkuk wrote this when everything around him was falling apart. God still gave him steady feet for high places. Ask him for that same steadiness.",q:"Which part of your game needs God’s steadiness most?"},
 {ref:"Philippians 4:13",title:"What It Really Means",read:"Paul wrote this about being content whether he had plenty or nothing. It’s less about winning every game and more about having Christ’s strength in any outcome.",q:"How does this verse sound different if you lose today?"}]},
{id:"grace",related:["thankful","identity"],title:"Win With Grace",sub:"For humility and success",scene:"court",about:"Success tests your heart as much as failure. Four days on staying humble when things go your way.",days:[
 {ref:"1 Peter 5:6",title:"Who Lifts You",read:"Humility isn’t thinking less of yourself. It’s trusting God with your rise. You don’t have to promote yourself when God is the one who lifts in due time.",q:"Where are you trying to lift yourself up?"},
 {ref:"Proverbs 16:18",title:"Before the Fall",read:"Every athlete has seen a team celebrate too early. Pride makes us careless. Humility keeps us learning.",q:"Where has pride made you careless?"},
 {ref:"1 Samuel 16:7",title:"The Heart",read:"God picked David, the youngest son, the one nobody scouted. People look at size and stats. God looks at the heart.",q:"What does God see when he looks at your heart?"},
 {ref:"1 Corinthians 10:31",title:"Bigger Than the Game",read:"Eating, drinking, practicing, competing: all of it can point to God. Your sport can be worship when you play it with gratitude.",q:"How can today’s practice be an act of worship?"}]},
{id:"grind",related:["camp","coach"],title:"The Grind",sub:"For discipline and endurance",scene:"track",about:"The unseen work: early mornings, extra reps, getting back up. Four days on training your body and your soul.",days:[
 {ref:"1 Timothy 4:8",title:"Train Both",read:"Paul says bodily training has real value. He just says godliness is worth even more. Train your body and your soul.",q:"What does your spiritual training plan look like?"},
 {ref:"Hebrews 12:1",title:"Drop the Weight",read:"No sprinter races in a heavy coat. Hebrews says to lay aside every weight and run with perseverance.",q:"What weight do you need to drop?"},
 {ref:"James 1:2-3",title:"Tested",read:"Testing produces endurance. Hard seasons work like interval training for your faith.",q:"What test are you in right now?"},
 {ref:"Proverbs 24:16",title:"Get Back Up",read:"Falling is part of every sport. Getting back up is the habit to build, as many times as it takes.",q:"Where do you need to get back up today?"}]},
{"id": "rest", "title": "Running on Empty", "sub": "For burnout and fatigue", "scene": "summit", "related": ["grind", "thankful"], "about": "Five days for when the love of the game has turned into survival mode. Rest is part of the plan, not a sign of weakness.", "days": [{"ref": "Matthew 11:28", "title": "Come Tired", "read": "Jesus doesn’t wait for you to get your energy back before you come to him. He invites the worn out and heavy-loaded exactly as they are. You don’t need a better attitude first. You just need to come. Tell him honestly how tired you are today.", "q": "What has been wearing you down the most?"}, {"ref": "1 Kings 19:5", "title": "Sleep and Eat", "read": "When Elijah was so burned out he wanted to die, God didn’t lecture him. He let him sleep, then fed him, then let him sleep again. Sometimes the first step back to health is physical: real sleep, real food and a real break from the noise.", "q": "Are you taking care of your body’s basic needs this week?"}, {"ref": "Psalm 23:2-3", "title": "Green Pastures", "read": "The Shepherd makes his sheep lie down. Sheep don’t rest when they’re anxious, so the shepherd creates a safe place for them. God wants to lead you to rest that restores your soul, not just your legs.", "q": "Where could you find a “green pasture” this week?"}, {"ref": "Isaiah 40:31", "title": "Renewed Strength", "read": "Waiting on God isn’t sitting around. It’s trusting him enough to stop grinding on your own strength. The promise is renewed strength: some days to soar, some days to run and some days just to keep walking. All three count.", "q": "Which do you need today: to soar, to run or just to keep walking?"}, {"ref": "Nehemiah 8:10", "title": "Joy Comes Back", "read": "The joy of the Lord is strength. Burnout steals joy, but God can give it back. Think about why you first loved your sport. Ask God to restore that kid-like joy, and protect it this season.", "q": "What did you love about your sport when you first started?"}]},
{"id": "unity", "title": "One Team", "sub": "For team conflict and unity", "scene": "pool", "related": ["captain", "words"], "about": "Five days for locker rooms that are divided, tense or just not clicking. Chemistry is built one choice at a time.", "days": [{"ref": "Psalm 133:1", "title": "Good and Pleasant", "read": "Unity isn’t automatic, even on talented teams. David calls it good and pleasant, like oil running down and dew falling on the mountains. Teams that genuinely like each other play for each other.", "q": "How would you describe your team’s chemistry right now?"}, {"ref": "Romans 12:18", "title": "Your Part", "read": "Paul admits peace isn’t always possible, because other people make their own choices. But he says, as far as it depends on you, live at peace. Focus on your part: your words, your attitude and your apologies.", "q": "What is your part in the tension on your team?"}, {"ref": "Ephesians 4:32", "title": "Forgive Fast", "read": "Grudges spread on teams like an injury you play through. They slow everyone down. Paul says forgive as God forgave you: fully and freely. Forgiveness doesn’t mean the hurt wasn’t real. It means you stop keeping score.", "q": "Who do you need to forgive, even if they haven’t asked?"}, {"ref": "Galatians 6:2", "title": "Carry Each Other", "read": "Every teammate is carrying something you can’t see. Carrying each other’s burdens means noticing, asking and helping. A team that carries each other off the field plays together on it.", "q": "Which teammate might be carrying something heavy right now?"}, {"ref": "Colossians 3:14", "title": "Bound Together", "read": "After a long list of virtues, Paul says to put on love, which binds everything together in perfect unity. Skill wins games. Love holds teams together when things go wrong.", "q": "What would it look like for love to hold your team together?"}]},
{"id": "losing", "title": "Losing Season", "sub": "For when the wins aren't coming", "scene": "court", "related": ["comeback", "mistakes"], "about": "Five days for a season that isn’t going the way you hoped. Your worth isn’t in your record.", "days": [{"ref": "Psalm 42:11", "title": "Talk to Your Soul", "read": "The psalmist argues with his own discouragement: “Why are you in despair, my soul? Hope in God!” A losing season makes your thoughts loud and negative. You can coach your own soul back to hope.", "q": "What are you telling yourself about this season?"}, {"ref": "Micah 7:8", "title": "I Will Rise", "read": "Micah admits the fall and the darkness. He doesn’t pretend. But he also declares, “When I fall, I will arise.” Losses are real. They’re not final.", "q": "What would “rising” look like for you this week?"}, {"ref": "Habakkuk 3:17-18", "title": "Joy Without Results", "read": "Habakkuk imagined nothing growing at all, no crops, no herds, no results, and still chose to rejoice in God. Joy that depends on your record will disappear in a losing season. Joy rooted in God survives it.", "q": "Can you find one reason to rejoice that has nothing to do with winning?"}, {"ref": "Romans 5:3-4", "title": "What Losing Builds", "read": "Suffering produces perseverance, perseverance produces character and character produces hope. Losing seasons build things winning seasons can’t. Many great careers were forged in hard years.", "q": "What might this season be building in you?"}, {"ref": "2 Corinthians 4:17-18", "title": "Bigger Than the Record", "read": "Paul calls his troubles light and momentary compared to eternal glory. Your record matters this year. It won’t matter in eternity. Keep your effort high and your perspective higher.", "q": "How would you play if you truly believed this season isn’t the whole story?"}]},
{"id": "future", "title": "What’s Next?", "sub": "For recruiting and decisions about the future", "scene": "track", "related": ["jersey", "identity"], "about": "Five days for the season of offers, visits, decisions and waiting. God already knows where you’re headed.", "days": [{"ref": "Proverbs 16:9", "title": "Plan and Trust", "read": "Make a plan. Send the emails. Go to the camps. Then remember that the Lord directs your steps. Your plan is part of the process, but God’s direction is the final word.", "q": "What part of your future are you trying to control too tightly?"}, {"ref": "Jeremiah 29:11", "title": "Hope and a Future", "read": "God said this to people stuck far from home in a long, hard season. His plans for you are for good. You don’t need to see the whole map to trust the One who drew it.", "q": "What fear about the future do you need to give to God?"}, {"ref": "James 1:5", "title": "Ask for Wisdom", "read": "Big decisions don’t come with an answer key. God promises to give wisdom generously, without scolding you for asking. Ask him, ask wise people and pay attention to peace and clarity over time.", "q": "What decision do you need wisdom for?"}, {"ref": "Proverbs 3:5-6", "title": "Lean on Him", "read": "You won’t understand every part of the recruiting process: the offers that never come, the coach who goes quiet, the school that surprises you. Trust God with your whole heart, and he will make your path straight.", "q": "Where are you leaning on your own understanding?"}, {"ref": "Matthew 6:33", "title": "First Things First", "read": "Whatever school, team or path you choose, put God first in it. Seek his kingdom, and trust him with the rest. Where you go matters less than who you become there.", "q": "What kind of person do you want to be wherever you end up?"}]},
{"id": "scroll", "title": "Highlight Reel", "sub": "For social media and comparison", "scene": "lights", "related": ["identity", "grace"], "about": "Five days on comparison, followers and the pressure to look great online. You are more than your posts.", "days": [{"ref": "Galatians 6:4", "title": "Run Your Race", "read": "Paul says to test your own work instead of comparing yourself to someone else. Every scroll shows you someone faster, bigger or more famous. God hasn’t asked you to run their race, only yours.", "q": "Who do you compare yourself to most often?"}, {"ref": "Psalm 37:7", "title": "Don’t Fret", "read": "Fret means burning yourself up with worry or envy. Watching someone else’s highlights can do that. David says rest in God and wait patiently instead of fretting over someone else’s success.", "q": "How does social media affect your mood?"}, {"ref": "Galatians 1:10", "title": "Whose Approval?", "read": "Paul asked whether he was trying to please people or God. Likes and comments rise and fall with your last performance. God’s approval doesn’t.", "q": "Whose approval are you chasing when you post?"}, {"ref": "Proverbs 27:2", "title": "Let Others Praise You", "read": "You don’t have to post every accomplishment. Let your work speak for itself. Humility online is rare, and it stands out.", "q": "What would change if you posted less about yourself?"}, {"ref": "Philippians 4:8", "title": "Fill Your Feed", "read": "What you think about shapes who you become, and what you scroll shapes what you think about. Fill your mind with what is true, honorable, pure and lovely. Curate your feed like you curate your diet.", "q": "What accounts or content do you need to unfollow or add?"}]},
{"id": "captain", "title": "Wear the C", "sub": "For captains and leaders", "scene": "turf", "related": ["unity", "coach"], "about": "Five days on leading your team the way Jesus led: by serving first.", "days": [{"ref": "Mark 10:45", "title": "Serve First", "read": "Jesus, the greatest leader in history, said he came to serve, not to be served. The best captains carry equipment, check on the bench and do the unglamorous work first.", "q": "What is one unglamorous way you can serve your team this week?"}, {"ref": "1 Timothy 4:12", "title": "Lead by Example", "read": "Paul told young Timothy not to let anyone look down on him for being young, but to be an example in speech, life, love, faith and purity. People follow what you do more than what you say.", "q": "Which of those five areas is your strongest example? Which is weakest?"}, {"ref": "1 Kings 3:9", "title": "Ask for Wisdom", "read": "When God offered Solomon anything, he asked for an understanding heart to lead people well. Leadership is full of hard calls. Ask God for wisdom before you ask for anything else.", "q": "What hard leadership decision are you facing?"}, {"ref": "Proverbs 15:1", "title": "Calm in the Storm", "read": "When tempers flare, a gentle answer turns away wrath. Captains set the emotional temperature of a team. Stay calm, and your team will follow.", "q": "How do you usually react when the team gets heated?"}, {"ref": "Joshua 1:9", "title": "Courage to Lead", "read": "God told Joshua three times to be strong and courageous as he took over leadership from Moses. Leading is scary sometimes. You don’t do it alone. God goes with you.", "q": "Where do you need courage to lead right now?"}]},
{"id": "jersey", "title": "After the Jersey", "sub": "For life after sports", "scene": "summit", "related": ["identity", "future"], "about": "Five days for seniors, retiring athletes and anyone wondering who they’ll be when the playing stops.", "days": [{"ref": "Ecclesiastes 3:1", "title": "A Time for Everything", "read": "There’s a season to play and a season to stop. Every career ends. That’s not a tragedy. It’s the shape of life. God is the God of every season, including the next one.", "q": "What season are you in right now?"}, {"ref": "2 Timothy 4:7", "title": "Finish Well", "read": "Paul didn’t say he won every race. He said he fought the good fight, finished the course and kept the faith. Finish your career so you can say the same.", "q": "What do you want to be able to say when your career ends?"}, {"ref": "Isaiah 43:18-19", "title": "A New Thing", "read": "God tells his people not to dwell on the past because he’s doing something new. The end of your sport is the start of something else. Look for the new thing God is doing.", "q": "What new thing might God be preparing for you?"}, {"ref": "Psalm 147:10-11", "title": "More Than Your Legs", "read": "God doesn’t love you for your speed or strength. He delights in people who trust him. When your athletic identity fades, his delight in you doesn’t.", "q": "What will remain true about you when you no longer play?"}, {"ref": "Ephesians 2:10", "title": "Made for Good Works", "read": "You were created for good works God prepared in advance, and many of them have nothing to do with sports. The discipline, teamwork and perseverance you built will serve you for the rest of your life.", "q": "Which lessons from sports do you want to carry into the rest of your life?"}]},
{"id": "identity", "title": "More Than an Athlete", "sub": "For finding your worth beyond performance", "scene": "court", "related": ["scroll", "jersey"], "about": "Five days on who you are when the scoreboard, the stats and the rankings are stripped away.", "days": [{"ref": "Genesis 1:27", "title": "Made in His Image", "read": "Before you were an athlete, you were made in the image of God. That gives you worth that no performance can add to or take away.", "q": "What would change if you really believed your worth came from being made in God’s image?"}, {"ref": "Psalm 139:14", "title": "Wonderfully Made", "read": "You were designed with care, including the parts of your body you’d change if you could. Thank God for how he made you.", "q": "What do you need to thank God for about how he made you?"}, {"ref": "1 John 3:1", "title": "Called His Child", "read": "God calls you his child. Not a recruit, not a stat line, not a ranking. A beloved son or daughter.", "q": "How does being God’s child change how you see a bad game?"}, {"ref": "Galatians 2:20", "title": "Christ in You", "read": "Paul says Christ lives in him, the One who loved him and gave himself for him. Your identity is rooted in being loved by Jesus, not in being impressive.", "q": "Where do you look for identity besides Jesus?"}, {"ref": "Romans 8:38-39", "title": "Nothing Separates", "read": "Not a loss, not an injury, not a cut, not the end of your career. Nothing can separate you from God’s love. That’s the most secure identity there is.", "q": "What do you fear could separate you from God’s love?"}]},
{"id": "mistakes", "title": "Next Play", "sub": "For mistakes, failure and grace", "scene": "turf", "related": ["gameday", "losing"], "about": "Five days for when you can’t stop replaying what went wrong.", "days": [{"ref": "Philippians 3:13-14", "title": "Forget What’s Behind", "read": "Paul had plenty to regret, but he chose to forget what was behind and press on. Learn from the mistake, then let it go and move to the next play.", "q": "What mistake do you keep replaying?"}, {"ref": "Psalm 103:12", "title": "East From West", "read": "God removes your sins as far as the east is from the west. Forgiven means gone. Stop picking back up what God has already taken away.", "q": "What do you need to stop carrying?"}, {"ref": "Lamentations 3:22-23", "title": "New Every Morning", "read": "God’s mercies are new every morning. Yesterday’s mistake doesn’t carry over into today’s grace.", "q": "How can you treat today as a fresh start?"}, {"ref": "John 21:17", "title": "Restored", "read": "After Peter denied Jesus three times, Jesus asked him three times if he loved him, then gave him a job to do. Failure isn’t final with Jesus.", "q": "Where do you need Jesus to restore you?"}, {"ref": "Romans 8:1", "title": "No Condemnation", "read": "In Christ there is no condemnation. Conviction leads you to make things right. Condemnation keeps you stuck in shame. Only one of those voices is God’s.", "q": "Which voice have you been listening to?"}]},
{"id": "coach", "title": "Coachable", "sub": "For handling coaches and correction", "scene": "track", "related": ["captain", "grind"], "about": "Five days on receiving correction, respecting authority and getting better because of it.", "days": [{"ref": "Proverbs 12:1", "title": "Love Correction", "read": "Whoever loves correction loves knowledge. It’s blunt, but true. The most coachable athletes improve the fastest.", "q": "How do you usually respond when you’re corrected?"}, {"ref": "Hebrews 12:11", "title": "Fruit Later", "read": "No discipline feels good in the moment. Afterward, it produces good fruit. Trust the process, even when practice is hard.", "q": "What hard training is producing something good in you?"}, {"ref": "Proverbs 15:22", "title": "Many Counselors", "read": "Plans fail without advice and succeed with many advisers. Coaches, trainers and mentors see things you can’t see in yourself.", "q": "Who could give you helpful feedback right now?"}, {"ref": "Colossians 3:23", "title": "For the Lord", "read": "Even when a coach is unfair, you can give your effort as if you’re working for the Lord. Your effort is ultimately offered to God, not just to the person with the whistle.", "q": "How would your effort change if you played for God first?"}, {"ref": "James 1:19", "title": "Quick to Listen", "read": "Be quick to listen, slow to speak and slow to anger. Coachable athletes listen first and react later.", "q": "What would change if you listened before responding to your coach?"}]},
{"id": "words", "title": "Locker Room Talk", "sub": "For the words you say to others and yourself", "scene": "pool", "related": ["unity", "captain"], "about": "Five days on trash talk, gossip, encouragement and self-talk.", "days": [{"ref": "Ephesians 4:29", "title": "Words That Build", "read": "Paul says only speak what builds others up. Every word you say is either building or tearing down.", "q": "What kind of words do you use most in the locker room?"}, {"ref": "James 3:5", "title": "Small Spark", "read": "A small spark can burn down a forest. One careless comment can poison a team culture.", "q": "Have any of your words caused damage lately?"}, {"ref": "Proverbs 12:25", "title": "A Good Word", "read": "Anxiety weighs people down, but a kind word lifts them up. Your words can change a teammate’s day.", "q": "Who needs a good word from you today?"}, {"ref": "Psalm 19:14", "title": "Self-Talk", "read": "David prayed that his words and his thoughts would please God. What you say to yourself after a mistake matters too.", "q": "What does your self-talk sound like after a mistake?"}, {"ref": "Philippians 2:14", "title": "No Complaining", "read": "Complaining spreads fast on teams. Paul says to do everything without grumbling, and you’ll shine like stars.", "q": "What do you complain about most?"}]},
{"id": "thankful", "title": "Grateful Heart", "sub": "For gratitude in every season", "scene": "lights", "related": ["grace", "rest"], "about": "Five days on noticing God’s gifts, in winning seasons and losing ones.", "days": [{"ref": "Psalm 103:2", "title": "Don’t Forget", "read": "David told his own soul to remember God’s benefits. Gratitude takes intentional remembering.", "q": "What has God done for you that you’ve forgotten to thank him for?"}, {"ref": "1 Thessalonians 5:16-18", "title": "In Everything", "read": "Give thanks in every circumstance. Not for every bad thing, but in the middle of it.", "q": "What can you thank God for in a hard situation right now?"}, {"ref": "Deuteronomy 8:18", "title": "Who Gave the Power", "read": "God gives the ability to succeed. Your talent, health and opportunities came from somewhere.", "q": "What ability do you need to thank God for?"}, {"ref": "Philippians 4:11-12", "title": "Content in Any Season", "read": "Paul learned contentment in plenty and in want. Gratitude and contentment go together.", "q": "Where are you discontent right now?"}, {"ref": "Psalm 107:1", "title": "His Love Endures", "read": "Give thanks, because God is good and his love never fails. His love has an undefeated record.", "q": "Where have you seen God’s goodness this week?"}]},
{"id": "offseason", "title": "The Off-Season", "sub": "A week for rest, reset and growth", "scene": "summit", "related": ["camp", "rest"], "about": "Seven days for the quiet months between seasons, when no one is watching and real growth happens.", "days": [{"ref": "Mark 6:31", "title": "Come Away", "read": "Jesus told his tired disciples to come away to a quiet place and rest. Start your off-season by actually resting. Let your body heal and your mind reset before you start building again.", "q": "How do you need to rest before you start training again?"}, {"ref": "Ecclesiastes 3:1", "title": "A Different Season", "read": "The off-season has a different purpose than the playoffs. It’s not wasted time. It’s a time to recover, reflect and rebuild. Embrace what this season is for.", "q": "What is this off-season for, in your sport and your faith?"}, {"ref": "Lamentations 3:40", "title": "Review the Film", "read": "Good athletes look back honestly at the season. Do the same with your heart. What went well? What needs to change? Then turn to God for help.", "q": "What is one lesson from last season you don’t want to forget?"}, {"ref": "Psalm 1:3", "title": "Grow Roots", "read": "Trees grow their deepest roots in the quiet seasons. Build habits now, like daily scripture and prayer, that will hold you up when next season gets busy.", "q": "What spiritual habit do you want to build this off-season?"}, {"ref": "Proverbs 6:6", "title": "Work Without a Crowd", "read": "The ant works without anyone watching. Off-season workouts are where you separate yourself, because no one is cheering. Work for God, not for an audience.", "q": "What is your off-season training plan?"}, {"ref": "Luke 2:52", "title": "Grow in Every Way", "read": "Jesus grew in wisdom, stature and favor with God and people. Use the off-season to grow in more than just your sport: friendships, family, school and faith.", "q": "Which area outside of sports do you want to grow in?"}, {"ref": "Philippians 1:6", "title": "He’s Not Finished", "read": "God finishes what he starts. As you prepare for the next season, trust that he’s still working on you, in your game and in your heart.", "q": "What are you trusting God to finish in you?"}]},
{"id": "camp", "title": "Training Camp", "sub": "A 21-day plan to build faith like you build fitness", "scene": "track", "related": ["offseason", "captain"], "about": "Three weeks, three phases. Week one builds your foundation, week two builds endurance and week three gets you game ready.", "days": [{"ref": "Matthew 7:24-25", "title": "Week 1: The Foundation", "read": "Every great season starts with a foundation. Jesus said the wise builder built on the rock by hearing his words and doing them. This week is about laying that foundation in your faith.", "q": "What is your faith built on right now?"}, {"ref": "Psalm 119:105", "title": "Week 1: Know the Playbook", "read": "You can’t run plays you don’t know. God’s word is your playbook, a lamp for your next step. Commit to reading some of it every day for these three weeks.", "q": "When will you read scripture each day during this plan?"}, {"ref": "Mark 1:35", "title": "Week 1: Early Work", "read": "Jesus got up early to pray before the crowds came. Find your quiet time and protect it like a workout.", "q": "What time of day will you meet with God?"}, {"ref": "Psalm 139:14", "title": "Week 1: Know Your Body", "read": "You were fearfully and wonderfully made. Take care of your body as a gift from God, with sleep, nutrition and recovery.", "q": "What part of your health do you most need to improve?"}, {"ref": "Proverbs 13:20", "title": "Week 1: Pick Your Training Partners", "read": "You become like the people you spend time with. Choose friends who push you toward God and toward good.", "q": "Who are your spiritual training partners?"}, {"ref": "Philippians 4:13", "title": "Week 1: The Right Strength", "read": "Paul learned contentment in every situation through Christ’s strength. Real strength isn’t winning every game. It’s peace in every outcome.", "q": "Where do you need Christ’s strength this week?"}, {"ref": "Genesis 2:2", "title": "Week 1: Rest Day", "read": "Even God rested. Take today off from striving. Spend a little extra time just being with God.", "q": "How will you rest today?"}, {"ref": "Hebrews 12:1", "title": "Week 2: Drop the Weight", "read": "No runner races in a heavy coat. What sin or distraction is slowing you down? Lay it aside this week.", "q": "What weight do you need to drop?"}, {"ref": "Romans 5:3-4", "title": "Week 2: Embrace the Burn", "read": "Conditioning hurts, but it builds endurance. Hard seasons in life build perseverance, character and hope the same way.", "q": "What hard thing is building endurance in you?"}, {"ref": "Galatians 6:9", "title": "Week 2: Don’t Quit", "read": "The middle of camp is where people quit. Don’t grow weary in doing good. The harvest comes if you don’t give up.", "q": "Where are you tempted to give up?"}, {"ref": "Isaiah 40:29", "title": "Week 2: Strength for the Tired", "read": "God gives power to the weak. When you’re out of gas, ask him for strength you can’t produce yourself.", "q": "Where do you need God’s strength today?"}, {"ref": "James 1:12", "title": "Week 2: Tested", "read": "Blessed is the one who endures trials. Testing shows what you’re made of, and God promises a crown that lasts.", "q": "What test are you facing right now?"}, {"ref": "2 Corinthians 4:8-9", "title": "Week 2: Not Crushed", "read": "Pressed but not crushed, struck down but not destroyed. You might get knocked down. You won’t get knocked out.", "q": "Where do you feel pressed right now?"}, {"ref": "Mark 6:31", "title": "Week 2: Rest Day", "read": "Jesus took his team away to rest. Recover today in body and soul.", "q": "What helps you recover best?"}, {"ref": "Joshua 1:9", "title": "Week 3: Courage", "read": "Game day is coming. God told Joshua to be strong and courageous because God was with him wherever he went. That includes your next game.", "q": "What upcoming moment needs courage?"}, {"ref": "Psalm 46:10", "title": "Week 3: Be Still", "read": "Before the noise of warmups, be still and remember that God is God. Build a moment of stillness into your pregame routine.", "q": "Where can you add stillness to your routine?"}, {"ref": "Colossians 3:23", "title": "Week 3: Audience of One", "read": "Play heartily for the Lord, not for people. That frees you from needing the crowd’s approval.", "q": "Who are you really playing for?"}, {"ref": "1 Corinthians 9:24", "title": "Week 3: Run to Win", "read": "Paul says run in a way that wins the prize. Faith isn’t passive. Compete with full effort in your sport and in following Jesus.", "q": "What does running to win look like for you this week?"}, {"ref": "Proverbs 27:17", "title": "Week 3: Sharpen Each Other", "read": "Iron sharpens iron. Push your teammates toward their best, and let them push you.", "q": "Who will you sharpen this week?"}, {"ref": "1 Corinthians 10:31", "title": "Week 3: For His Glory", "read": "Whatever you do, do it all for the glory of God. Win or lose, let your season point to him.", "q": "How can your season bring glory to God?"}, {"ref": "2 Timothy 4:7", "title": "Week 3: Finish Strong", "read": "Paul fought the good fight and finished the race. You’ve finished camp. Now take what you’ve built into the season, and finish strong.", "q": "What will you carry from these three weeks into your season?"}]}
];
