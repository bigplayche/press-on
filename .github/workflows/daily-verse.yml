name: Daily verse notification

on:
  schedule:
    - cron: "50 * * * *"   # every hour; schedules 6:00 a.m. delivery for time zones reaching 6 a.m. next
  workflow_dispatch:
    inputs:
      test:
        description: "Send today's verse to every subscriber right now"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send the daily verse
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: node scripts/send-daily-verse.mjs
      # GitHub pauses scheduled jobs in repositories with no activity for 60 days.
      # A tiny monthly commit keeps the daily reminders running.
      - name: Keep the schedule active
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            date -u > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "Keep daily verse reminders running"
            git push
          fi
